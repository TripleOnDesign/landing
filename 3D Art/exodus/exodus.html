<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Exodus: The Parting</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: radial-gradient(circle, #020d1e, #00040c);
            color: #e6edf3;
            font-family: 'Cinzel', serif;
            cursor: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 글라스모피즘 모달 */
        #guideModal {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            z-index: 200;
            padding: 16px 24px;
            max-width: calc(100vw - 40px);
            background: rgba(10, 20, 50, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }
        #guideModal.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0px);
        }
        #guideModal.fadeout {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }
        #guideModal .guide-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(10px, 2.5vw, 13px);
            color: rgba(220, 230, 245, 0.70);
            line-height: 1.5;
            letter-spacing: clamp(1px, 0.8vw, 3px);
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #dragHint {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 200;
            padding: 16px 24px;
            max-width: calc(100vw - 40px);
            background: rgba(10, 20, 50, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }
        #dragHint.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }
        #dragHint.fadeout {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }
        #dragHint .guide-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(10px, 2.5vw, 13px);
            color: rgba(220, 230, 245, 0.70);
            line-height: 1.5;
            letter-spacing: clamp(1px, 0.8vw, 3px);
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        /* ── 스크린 플래시 (번개) ── */
        #screenFlash {
            position: fixed;
            inset: 0;
            z-index: 300;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 30%, rgba(200,220,255,0.9), rgba(100,140,200,0.3), transparent 70%);
            opacity: 0;
            transition: opacity 0.05s ease-out;
            mix-blend-mode: screen;
        }
        #screenFlash.flash {
            opacity: 1;
        }

        /* ── 시네마틱 비네트 ── */
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 150;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,2,8,0.65) 100%);
        }

        /* ── 자막 (Subtitle) ── */
        #subtitle {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 180;
            font-family: 'Cinzel', serif;
            font-size: clamp(11px, 3vw, 15px);
            color: rgba(200, 215, 240, 0.0);
            letter-spacing: clamp(2px, 1.5vw, 6px);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(100,150,255,0.5), 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: color 3s ease, text-shadow 3s ease;
            white-space: nowrap;
            max-width: calc(100vw - 40px);
        }
        #subtitle.visible {
            color: rgba(200, 215, 240, 0.7);
        }
        #subtitle.fadeout {
            color: rgba(200, 215, 240, 0.0);
        }

        /* ── 필름 그레인 오버레이 ── */
        #filmGrain {
            position: fixed;
            inset: 0;
            z-index: 160;
            pointer-events: none;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            animation: grainAnim 0.3s steps(4) infinite;
        }
        @keyframes grainAnim {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-5%, -5%); }
            50% { transform: translate(5%, 3%); }
            75% { transform: translate(-3%, 5%); }
        }
    </style>
</head>

<body>
    <div id="screenFlash"></div>
    <div id="vignette"></div>
    <div id="subtitle">The Sea Shall Part Before You</div>
    <div id="filmGrain"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script id="waterVertexShader" type="x-shader/x-vertex">
        uniform float time;
        uniform float partProgress;
        uniform float pathWidth;
        uniform vec3 staffPos;
        varying vec2 vUv;
        varying float vHeight;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vWallFactor;
        varying float vWallT;

        // 다중 파도 높이 함수 (여러 방향의 사인파 합성)
        float waveH(vec2 p) {
            float h = 0.0;
            h += sin(p.x * 0.040 + p.y * 0.015 + time * 1.20) * 4.2;
            h += cos(p.x * 0.030 - p.y * 0.050 + time * 0.85) * 3.5;
            h += sin(p.x * 0.075 + p.y * 0.055 + time * 2.00) * 2.0;
            h += cos(p.x * 0.110 - p.y * 0.090 + time * 1.60) * 1.2;
            h += sin(p.x * 0.018 + p.y * 0.065 - time * 0.55) * 2.8;
            return h;
        }

        // 벽 표면 물결 디테일 (다층 FBM + 흘러내리는 물줄기)
        float wallDetail(vec2 p) {
            float d = 0.0;
            // 대형 요동
            d += sin(p.x * 0.10 + p.y * 0.15 + time * 2.5) * 10.0;
            d += cos(p.x * 0.18 - p.y * 0.12 + time * 3.8) * 7.0;
            // 중형 물결
            d += sin(p.x * 0.30 + p.y * 0.35 + time * 5.5) * 4.0;
            d += cos(p.x * 0.55 - p.y * 0.40 + time * 7.0) * 2.5;
            // 세밀 디테일
            d += sin(p.x * 0.85 + p.y * 0.70 + time * 9.5) * 1.2;
            d += cos(p.x * 1.20 - p.y * 0.95 + time * 12.0) * 0.6;
            // 흘러내리는 물줄기 (Y방향 — 수직 흐름)
            d += sin(p.y * 0.25 + time * 4.5) * 14.0
               * (0.5 + 0.5 * sin(p.x * 0.06 + 1.7));
            d += cos(p.y * 0.40 - time * 6.5) * 9.0
               * (0.5 + 0.5 * cos(p.x * 0.10 - 0.8));
            d += sin(p.y * 0.65 + time * 9.0) * 5.0
               * (0.5 + 0.5 * sin(p.x * 0.15 + 3.2));
            return d;
        }

        void main() {
            vUv = uv;
            vec3 pos = position;
            vWallFactor = 0.0;
            vWallT = 0.0;

            float baseH = waveH(pos.xy);
            pos.z += baseH;

            // 유한차분으로 정확한 서페이스 노말 계산
            float eps = 4.0;
            float hL = waveH(pos.xy + vec2(-eps, 0.0));
            float hR = waveH(pos.xy + vec2( eps, 0.0));
            float hD = waveH(pos.xy + vec2(0.0, -eps));
            float hU = waveH(pos.xy + vec2(0.0,  eps));
            vec3 normal = normalize(vec3((hL - hR) / (2.0 * eps), (hD - hU) / (2.0 * eps), 1.0));

            float absX = abs(pos.x);
            float wallWidth = 120.0;

            if (absX < pathWidth) {
                float residual = sin(pos.y * 0.3 + time * 2.0) * 0.5 * (1.0 - partProgress);
                pos.z = mix(pos.z, -15.0 + residual, partProgress);
                normal = mix(normal, vec3(0.0, 0.0, 1.0), partProgress);
            } else if (absX >= pathWidth && absX < pathWidth + wallWidth) {
                float t = (absX - pathWidth) / wallWidth;
                vWallT = t;

                // 물벽 곡선: 더 급격한 안쪽 수직면 + 부드러운 바깥쪽
                float wallCurve = pow(sin(t * 1.5707963), 0.45);

                // 벽 높이 (안쪽이 가장 높음)
                float wallHeight = 200.0 * wallCurve;

                // 꼭대기 파도 마루 — 안쪽으로 말려 넘어가는 느낌
                float crestCurl = 0.0;
                if (t < 0.25) {
                    // 안쪽 가장자리: 꼭대기가 안쪽으로 살짝 말림
                    float curlT = t / 0.25;
                    crestCurl = sin(curlT * 3.14159) * 18.0 * wallCurve;
                    crestCurl *= (0.6 + 0.4 * sin(pos.y * 0.08 + time * 2.5));
                }

                // 다층 터뷸런스
                float turb = wallDetail(pos.xy);

                // 꼭대기 불안정한 물결 (파도 마루처럼)
                float crestTurb = sin(pos.y * 0.08 + time * 2.5) * 28.0
                                + cos(pos.y * 0.14 - time * 3.8) * 18.0
                                + sin(pos.y * 0.25 + time * 5.5) * 8.0;
                crestTurb *= smoothstep(0.0, 0.2, t) * (1.0 - smoothstep(0.5, 1.0, t));

                // 벽면 수평 물결 (안쪽으로 밀려드는 파동)
                float horizontalWave = sin(pos.y * 0.06 + time * 1.8) * 6.0
                                     * smoothstep(0.0, 0.4, t) * (1.0 - t);

                float finalZ = wallHeight + (turb + crestTurb + crestCurl) * partProgress;
                // 수평 변위 (벽이 안쪽으로 약간 밀려드는 느낌)
                float sideX = sign(pos.x);
                pos.x += sideX * horizontalWave * partProgress * 0.3;

                pos.z = mix(pos.z, finalZ, partProgress);

                // 벽면 노말: 높이 기울기 + 터뷸런스 반영
                float dZdt = 200.0 * 0.45 * pow(sin(t * 1.5707963), -0.55) * cos(t * 1.5707963) * 1.5707963 / wallWidth;
                vec3 wallNormal = normalize(vec3(sideX * -dZdt, 0.0, 1.0));

                // 터뷸런스에 의한 노말 디테일 (더 복잡)
                wallNormal.x += sin(pos.y * 0.20 + time * 3.0) * 0.18;
                wallNormal.x += sin(pos.y * 0.50 + time * 6.0) * 0.08;
                wallNormal.y += cos(pos.y * 0.18 + time * 2.5) * 0.12;
                wallNormal.y += cos(pos.y * 0.45 + time * 5.5) * 0.06;
                // 흘러내리는 물줄기에 의한 수직 노말 변동
                wallNormal.y += sin(pos.y * 0.35 + time * 4.5) * sin(pos.x * 0.08) * 0.10;
                wallNormal = normalize(wallNormal);

                normal = mix(normal, wallNormal, partProgress);
                vWallFactor = partProgress * wallCurve;
            }

            vHeight   = pos.z;
            vNormal   = normalMatrix * normal;
            vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <script id="waterFragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform vec3 waterColor;
        uniform vec3 wallColor;
        uniform float time;
        uniform vec3 staffPos;
        varying float vHeight;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vWallFactor;
        varying float vWallT;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise2(vec2 p) {
            vec2 i = floor(p); vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i+vec2(0,0)), hash(i+vec2(1,0)), u.x),
                       mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
        }
        // FBM for richer detail
        float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            for(int i = 0; i < 5; i++) {
                v += a * noise2(p);
                p *= 2.1;
                a *= 0.5;
            }
            return v;
        }
        // 코스틱 패턴 (수면 아래 물이 빛을 모아 만드는 무늬)
        float caustic(vec2 p) {
            float c = 0.0;
            c += sin(p.x * 3.5 + p.y * 2.1 + time * 2.5) * 0.5 + 0.5;
            c *= sin(p.x * 2.8 - p.y * 3.3 + time * 1.8) * 0.5 + 0.5;
            c += sin(p.x * 5.5 + p.y * 4.2 - time * 3.2) * 0.3;
            return c;
        }

        void main() {
            vec3 norm = normalize(vNormal);
            vec3 viewDir = normalize(cameraPosition - vWorldPos);

            // ── 밤 바다 팔레트 ──
            vec3 abyssCol   = vec3(0.000, 0.004, 0.014);
            vec3 deepCol    = vec3(0.002, 0.012, 0.038);
            vec3 midCol     = vec3(0.005, 0.025, 0.075);
            vec3 shallowCol = vec3(0.010, 0.045, 0.120);
            vec3 crestCol   = vec3(0.025, 0.080, 0.195);
            vec3 foamCol    = vec3(0.120, 0.190, 0.320);

            float d = clamp((vHeight + 2.0) / 14.0, 0.0, 1.0);
            vec3 baseColor  = mix(abyssCol,   deepCol,    smoothstep(0.0,  0.25, d));
            baseColor       = mix(baseColor,  midCol,     smoothstep(0.2,  0.55, d));
            baseColor       = mix(baseColor,  shallowCol, smoothstep(0.5,  0.80, d));
            baseColor       = mix(baseColor,  crestCol,   smoothstep(0.78, 1.0,  d));

            // ── 거품 ──
            float foamNoise = noise2(vWorldPos.xz * 0.08 + time * 0.35) * 0.6
                            + noise2(vWorldPos.xz * 0.18 - time * 0.25) * 0.4;
            float foamMask  = smoothstep(7.5, 12.0, vHeight) * foamNoise;
            baseColor = mix(baseColor, foamCol, foamMask * 0.70);

            // ── 달빛 방향 ──
            vec3 moonDir = normalize(vec3(-0.69, 0.55, -0.46));

            // ── 달빛 Diffuse ──
            float diff = max(dot(norm, moonDir), 0.0);
            baseColor += vec3(0.025, 0.040, 0.075) * diff;

            // ── Blinn-Phong Specular ──
            vec3 halfV = normalize(moonDir + viewDir);
            float spec = pow(max(dot(norm, halfV), 0.0), 180.0);
            baseColor += vec3(0.80, 0.88, 1.00) * spec * 0.90;

            // ── MOONPATH ──
            float moonAngle = max(dot(reflect(-moonDir, norm), viewDir), 0.0);
            baseColor += vec3(0.95, 0.97, 1.00) * pow(moonAngle, 350.0) * 5.0;
            baseColor += vec3(0.55, 0.68, 0.90) * pow(moonAngle, 55.0) * 0.65;
            baseColor += vec3(0.12, 0.18, 0.32) * pow(moonAngle, 8.0) * 0.40;

            // ── Fresnel ──
            float fresnel = pow(1.0 - max(dot(norm, viewDir), 0.0), 4.0);
            vec3 skyRefl  = vec3(0.002, 0.006, 0.020);
            baseColor     = mix(baseColor, skyRefl, fresnel * 0.55);

            // ═══════════════════════════════════════════
            // ── 물벽 렌더링 ──
            // ═══════════════════════════════════════════
            if (vHeight > 15.0 && vWallFactor > 0.01) {
                float wf = smoothstep(15.0, 45.0, vHeight);
                float heightNorm = clamp((vHeight - 15.0) / 190.0, 0.0, 1.0);

                // ── 1. 깊이별 물색 (실제 물처럼 아래=짙고 위=투명) ──
                vec3 wallAbyss   = vec3(0.003, 0.012, 0.040);
                vec3 wallDeep    = vec3(0.008, 0.030, 0.085);
                vec3 wallMid     = vec3(0.018, 0.065, 0.160);
                vec3 wallShallow = vec3(0.035, 0.110, 0.240);
                vec3 wallCrest   = vec3(0.070, 0.180, 0.340);
                vec3 wallTip     = vec3(0.120, 0.250, 0.420);

                vec3 wallBase = mix(wallAbyss, wallDeep, smoothstep(0.0, 0.18, heightNorm));
                wallBase = mix(wallBase, wallMid, smoothstep(0.15, 0.40, heightNorm));
                wallBase = mix(wallBase, wallShallow, smoothstep(0.35, 0.65, heightNorm));
                wallBase = mix(wallBase, wallCrest, smoothstep(0.60, 0.85, heightNorm));
                wallBase = mix(wallBase, wallTip, smoothstep(0.85, 0.98, heightNorm));

                // ── 2. 흘러내리는 물줄기 (다층 rivulets) ──
                float riv1 = fbm(vec2(vWorldPos.x * 0.06, vWorldPos.z * 0.025 - time * 1.2));
                float riv2 = fbm(vec2(vWorldPos.x * 0.12, vWorldPos.z * 0.05 - time * 2.0));
                float riv3 = fbm(vec2(vWorldPos.x * 0.25, vWorldPos.z * 0.10 - time * 3.5));
                float rivMask = smoothstep(0.42, 0.62, riv1) * 0.50
                              + smoothstep(0.48, 0.68, riv2) * 0.30
                              + smoothstep(0.52, 0.72, riv3) * 0.20;
                // 물줄기 = 표면이 매끄러워져 빛 반사가 강해지는 구간
                vec3 rivColor = mix(wallBase * 1.3, vec3(0.06, 0.14, 0.28), 0.4);
                wallBase = mix(wallBase, rivColor, rivMask * (0.4 + heightNorm * 0.6));

                // ── 3. SSS (물벽 투과광 — 꼭대기일수록 얇아서 빛이 통과) ──
                float thickness = mix(1.0, 0.15, heightNorm);  // 위가 얇음
                float sssDot = max(dot(-norm, moonDir), 0.0);
                float sss = pow(sssDot, 1.5) * (1.0 - thickness * 0.6);
                vec3 sssCol = mix(vec3(0.03, 0.15, 0.30), vec3(0.08, 0.28, 0.45), heightNorm);
                wallBase += sssCol * sss * smoothstep(0.3, 1.0, heightNorm) * 1.8;

                // 후방 투과 (뒤에서 빛이 올 때 물이 밝게 빛남)
                float backScatter = pow(max(dot(viewDir, -moonDir), 0.0), 2.5);
                wallBase += vec3(0.04, 0.14, 0.30) * backScatter * heightNorm * 1.0;

                // 측면 림라이트 (벽 가장자리가 빛남)
                float rimDot = 1.0 - max(dot(norm, viewDir), 0.0);
                float rim = pow(rimDot, 3.0);
                wallBase += vec3(0.03, 0.08, 0.18) * rim * 0.7;

                // ── 4. 코스틱 (벽 하단에 물결 빛무늬) ──
                float caust = caustic(vWorldPos.xz * 0.02 + vec2(time * 0.25, -time * 0.15));
                float caustS = caustic(vWorldPos.xz * 0.05 + vec2(-time * 0.4, time * 0.12));
                float caustMix = caust * 0.6 + caustS * 0.4;
                wallBase += vec3(0.05, 0.10, 0.22) * caustMix * (1.0 - heightNorm) * 0.55;

                // ── 5. 스페큘러 하이라이트 (다층) ──
                // 날카로운 핀포인트 (달빛 직사 반사)
                float sharpSpec = pow(max(dot(norm, halfV), 0.0), 200.0);
                wallBase += vec3(0.85, 0.90, 1.0) * sharpSpec * 1.5;
                // 중간 스페큘러 (물줄기 위 반짝임)
                float midSpec = pow(max(dot(norm, halfV), 0.0), 50.0);
                wallBase += vec3(0.20, 0.30, 0.55) * midSpec * (0.4 + rivMask * 0.6) * 0.6;
                // 넓은 스페큘러 (젖은 질감)
                float wideSpec = pow(max(dot(norm, halfV), 0.0), 10.0);
                wallBase += vec3(0.05, 0.08, 0.16) * wideSpec * 0.35;

                // ── 6. 내부 깊이 시뮬레이션 (벽 안쪽이 어두워 보이는 효과) ──
                float depthDarken = mix(0.5, 1.0, heightNorm);
                // 벽 두께에 따른 흡수 (아래쪽이 더 두껍고 어두움)
                float absorption = exp(-thickness * 2.5);
                depthDarken *= mix(absorption, 1.0, 0.4);
                wallBase *= depthDarken;

                // ── 7. 미세 노이즈 (물 표면 텍스처) ──
                float microN = fbm(vWorldPos.xz * 0.25 + vec2(0.0, -time * 0.6));
                float microN2 = fbm(vWorldPos.xz * 0.8 + vec2(time * 0.3, -time * 0.4));
                wallBase *= 0.88 + microN * 0.18 + microN2 * 0.06;

                // ── 8. 거품 ──
                // 꼭대기 거품 (부서지는 파도 마루)
                float crestFoam = smoothstep(0.80, 0.96, heightNorm);
                float crestFN = fbm(vec2(vWorldPos.x * 0.10, time * 1.8 + vWorldPos.z * 0.07));
                float crestFN2 = noise2(vec2(vWorldPos.x * 0.25, time * 3.0 + vWorldPos.z * 0.15));
                float foamDetail = crestFN * 0.7 + crestFN2 * 0.3;
                vec3 foamColor = mix(vec3(0.25, 0.35, 0.50), vec3(0.45, 0.55, 0.70), crestFN2);
                wallBase = mix(wallBase, foamColor, crestFoam * foamDetail * 0.90);

                // 바닥 접합부 거품 (물벽이 해저와 만나는 곳)
                float baseFoam = smoothstep(0.12, 0.0, heightNorm);
                float baseFN = noise2(vec2(vWorldPos.x * 0.08, time * 1.2 + vWorldPos.z * 0.06));
                wallBase = mix(wallBase, vec3(0.12, 0.18, 0.30), baseFoam * baseFN * 0.65);

                // 벽면 중간 산발적 거품 (불규칙한 하얀 점)
                float scatterFoam = noise2(vWorldPos.xz * 0.15 + time * 0.5);
                scatterFoam *= noise2(vWorldPos.xz * 0.4 - time * 0.8);
                scatterFoam = smoothstep(0.55, 0.70, scatterFoam) * (1.0 - heightNorm * 0.5);
                wallBase += vec3(0.08, 0.12, 0.20) * scatterFoam * 0.4;

                // ── 9. 지팡이 빛 반응 ──
                float staffDist = length(vWorldPos - staffPos);
                float staffGlow = 1.0 / (1.0 + staffDist * staffDist * 0.00004);
                vec3 staffLightCol = mix(vec3(0.20, 0.12, 0.03), vec3(0.12, 0.08, 0.02), heightNorm);
                wallBase += staffLightCol * staffGlow * 2.5;

                // ── 10. Fresnel (벽 가장자리 밝아짐) ──
                float wallFresnel = pow(1.0 - max(dot(norm, viewDir), 0.0), 3.5);
                wallBase += vec3(0.04, 0.10, 0.22) * wallFresnel * 0.7;

                // ── 최종 합성 ──
                baseColor = mix(baseColor, wallBase, wf * vWallFactor);
            }

            gl_FragColor = vec4(baseColor, 0.97);
        }
    </script>

    <script id="groundVertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        varying vec2 vPos;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vHeight;

        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453); }
        float noise(vec2 st) {
            vec2 i = floor(st); vec2 f = fract(st);
            vec2 u = f*f*(3.0-2.0*f);
            float a=random(i), b=random(i+vec2(1,0)), c=random(i+vec2(0,1)), d=random(i+vec2(1,1));
            return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
        }
        float fbm(vec2 st) {
            float v=0.0, a=0.5;
            for(int i=0;i<6;i++){v+=a*noise(st);st*=2.1;a*=0.48;}
            return v;
        }

        // 해저 협곡/크레바스
        float crevice(vec2 p) {
            float c = 0.0;
            c += smoothstep(0.02, 0.0, abs(fbm(p * 0.08) - 0.5)) * 6.0;
            c += smoothstep(0.04, 0.0, abs(fbm(p * 0.12 + vec2(3.7, 8.2)) - 0.48)) * 3.5;
            return c;
        }

        // 산호초 돌출
        float coralBump(vec2 p) {
            float n = fbm(p * 0.6);
            float mask = smoothstep(0.58, 0.72, n);
            float detail = fbm(p * 3.0) * 2.0 + fbm(p * 6.0) * 0.8;
            return mask * detail;
        }

        void main() {
            vec3 pos = position;
            vPos = pos.xy;

            // 해저 대형 지형 (완만한 해저 산맥)
            float macro = sin(pos.x * 0.02 + pos.y * 0.015) * 5.0
                        + cos(pos.x * 0.035 - pos.y * 0.02) * 3.5
                        + sin(pos.x * 0.008 + pos.y * 0.005) * 8.0;

            // 해저 중형 바위와 모래언덕
            float meso = fbm(pos.xy * 0.15) * 7.0;

            // 조류에 의한 모래 리플 (다방향 합성)
            float ripple = sin(pos.x * 0.45 + pos.y * 0.1) * 0.6
                         + sin(pos.x * 0.9 + pos.y * 0.25 + 1.5) * 0.3
                         + sin(pos.x * 1.8 - pos.y * 0.12) * 0.15
                         + cos(pos.y * 0.35 + pos.x * 0.15) * 0.4;

            // 세부 질감 (거친 해저면)
            float micro = fbm(pos.xy * 1.5) * 0.8;

            // 산호초 돌출 지형
            float coral = coralBump(pos.xy);

            // 해저 협곡 (깊은 골)
            float crev = crevice(pos.xy);

            // 잔여 물 흔들림 (시간에 따라 바닥에 남은 물이 출렁)
            float residualWater = sin(pos.x * 0.12 + uTime * 0.8) * 0.3
                                + cos(pos.y * 0.15 - uTime * 0.6) * 0.2;

            pos.z = -15.0 + macro + meso + ripple + micro + coral - crev + residualWater;
            vHeight = pos.z;

            // 유한차분 노말 (정밀)
            float ex = 2.5;
            float hC = pos.z;
            // X방향 기울기 (간략 근사)
            float dxR = sin((pos.x+ex)*0.45+(pos.y)*0.1)*0.6 + sin((pos.x+ex)*0.9+pos.y*0.25+1.5)*0.3;
            float dxL = sin((pos.x-ex)*0.45+(pos.y)*0.1)*0.6 + sin((pos.x-ex)*0.9+pos.y*0.25+1.5)*0.3;
            float dyU = sin(pos.x*0.45+(pos.y+ex)*0.1)*0.6 + sin(pos.x*0.9+(pos.y+ex)*0.25+1.5)*0.3;
            float dyD = sin(pos.x*0.45+(pos.y-ex)*0.1)*0.6 + sin(pos.x*0.9+(pos.y-ex)*0.25+1.5)*0.3;
            // 매크로 기울기 포함
            dxR += sin((pos.x+ex)*0.02+pos.y*0.015)*5.0;
            dxL += sin((pos.x-ex)*0.02+pos.y*0.015)*5.0;
            dyU += sin(pos.x*0.02+(pos.y+ex)*0.015)*5.0;
            dyD += sin(pos.x*0.02+(pos.y-ex)*0.015)*5.0;

            vec3 normal = normalize(vec3((dxL-dxR)/(2.0*ex), (dyD-dyU)/(2.0*ex), 1.0));

            vNormal   = normalMatrix * normal;
            vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <script id="groundFragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float uTime;
        uniform float uPathWidth;
        uniform float uPartProgress;
        varying vec2 vPos;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vHeight;

        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453); }
        float noise(vec2 st) {
            vec2 i = floor(st); vec2 f = fract(st);
            vec2 u = f*f*(3.0-2.0*f);
            float a=random(i), b=random(i+vec2(1,0)), c=random(i+vec2(0,1)), d=random(i+vec2(1,1));
            return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
        }
        float fbm(vec2 st) {
            float v=0.0, a=0.5;
            for(int i=0;i<6;i++){v+=a*noise(st);st*=2.1;a*=0.48;}
            return v;
        }

        vec2 voronoi(vec2 p) {
            vec2 i = floor(p); vec2 f = fract(p);
            float minDist = 1.0, secondDist = 1.0;
            for (int y = -1; y <= 1; y++) {
                for (int x = -1; x <= 1; x++) {
                    vec2 neighbor = vec2(float(x), float(y));
                    vec2 point = vec2(random(i + neighbor), random(i + neighbor + vec2(31.7, 17.3)));
                    float d = length(neighbor + point - f);
                    if (d < minDist) { secondDist = minDist; minDist = d; }
                    else if (d < secondDist) { secondDist = d; }
                }
            }
            return vec2(minDist, secondDist);
        }

        float caustic(vec2 p) {
            float c = (sin(p.x*3.2+p.y*2.3+uTime*2.0)*0.5+0.5)*(sin(p.x*2.7-p.y*3.5+uTime*1.5)*0.5+0.5);
            c += (sin(p.x*5.1+p.y*4.0-uTime*2.8)*0.5+0.5)*(cos(p.x*4.3-p.y*5.2+uTime*1.2)*0.5+0.5)*0.5;
            return c;
        }

        float starfishShape(vec2 p, float r) {
            float angle = atan(p.y, p.x);
            float d = length(p);
            float arms = 0.5 + 0.3 * cos(angle * 5.0);
            return smoothstep(r * arms, r * arms - 0.02, d);
        }

        void main() {
            vec3 norm = normalize(vNormal);
            float pathDist = abs(vWorldPos.x);

            // ── wetness: partProgress가 0이면 전부 깊은 바닷속, 1이면 마른 땅 ──
            // 물이 갈라진 정도에 따라 마른 땅이 드러남
            float distWet = 0.0;
            if (uPartProgress > 0.05) {
                // 물벽 바로 옆만 젖음 (좁은 범위)
                float wetEdge = uPathWidth;
                float dryStart = uPathWidth + 35.0;
                distWet = 1.0 - smoothstep(wetEdge, dryStart, pathDist);
                float innerWet = smoothstep(uPathWidth - 25.0, uPathWidth, pathDist);
                distWet = max(distWet, innerWet * 0.5);
                distWet *= distWet;
            }
            // partProgress가 낮으면 전부 젖은 상태 (깊은 바다)
            // partProgress가 높으면 거리 기반 wetness만 적용
            float wetness = mix(1.0, distWet, smoothstep(0.0, 0.6, uPartProgress));

            // ── 노이즈 ──
            float n1 = fbm(vPos * 0.10);
            float n2 = fbm(vPos * 0.45);
            float n4 = fbm(vPos * 0.25 + vec2(5.0, 3.0));
            float nMicro = fbm(vPos * 5.0);
            float rippleVis = sin(vPos.x*0.45+vPos.y*0.1)*0.5+0.5;
            rippleVis += sin(vPos.x*0.9+vPos.y*0.25+1.5)*0.25;
            rippleVis += cos(vPos.y*0.35+vPos.x*0.15)*0.15;
            rippleVis = clamp(rippleVis * 0.8, 0.0, 1.0);

            // ═══════════════════════════════════════
            // ── 마른 땅 (따뜻한 사막/황토 색감, 밝게) ──
            // ═══════════════════════════════════════
            vec3 drySandLight = vec3(0.62, 0.53, 0.38);
            vec3 drySandMid   = vec3(0.50, 0.42, 0.30);
            vec3 drySandDark  = vec3(0.40, 0.33, 0.24);
            vec3 dryEarth     = vec3(0.44, 0.35, 0.24);
            vec3 dryClay      = vec3(0.46, 0.32, 0.20);
            vec3 dryRockCol   = vec3(0.36, 0.32, 0.26);
            vec3 dryRockLight = vec3(0.46, 0.42, 0.34);

            vec3 dryColor = mix(drySandDark, drySandMid, smoothstep(0.25, 0.50, n1));
            dryColor = mix(dryColor, drySandLight, smoothstep(0.45, 0.72, n1));
            dryColor = mix(dryColor, dryEarth, smoothstep(0.62, 0.85, n1) * 0.45);
            dryColor = mix(dryColor * 0.90, dryColor * 1.06, rippleVis);
            // 마른 바위
            float dryRockMask = smoothstep(0.58, 0.78, n2);
            vec2 dryVor = voronoi(vPos * 0.3);
            float dryCrack = smoothstep(0.03, 0.07, dryVor.y - dryVor.x);
            dryColor = mix(dryColor, mix(dryRockCol, dryRockLight, dryCrack), dryRockMask * 0.65);
            // 점토 얼룩
            float clayMask = smoothstep(0.55, 0.72, fbm(vPos*0.30+vec2(7.3,2.1)));
            dryColor = mix(dryColor, dryClay, clayMask*(1.0-dryRockMask)*0.35);
            // 미세 질감
            dryColor *= 0.93 + nMicro * 0.14;
            // 마른 조개 껍데기 (밝은 흰색)
            vec2 dShellVor = voronoi(vPos * 0.8);
            float dShellMask = smoothstep(0.15, 0.08, dShellVor.x)
                             * smoothstep(0.55, 0.70, fbm(vPos*0.15+vec2(4.0,6.0)));
            vec3 dShellCol = mix(vec3(0.58, 0.55, 0.48), vec3(0.62, 0.58, 0.55), fbm(vPos*6.0));
            dryColor = mix(dryColor, dShellCol, dShellMask * 0.45);
            // 갈라진 마른 땅 균열
            float dCrevMask = smoothstep(0.02, 0.0, abs(fbm(vPos*0.08)-0.5));
            dryColor = mix(dryColor, drySandDark * 0.70, dCrevMask * 0.45);

            // ═══════════════════════════════════════
            // ── 젖은 해저 (어둡고 차가운 톤) ──
            // ═══════════════════════════════════════
            vec3 wetSandDk = vec3(0.10, 0.09, 0.06);
            vec3 wetSandMd = vec3(0.16, 0.14, 0.09);
            vec3 wetSandLt = vec3(0.22, 0.19, 0.12);
            vec3 darkRock  = vec3(0.08, 0.07, 0.07);
            vec3 greenRock = vec3(0.08, 0.13, 0.08);
            vec3 rustRock  = vec3(0.18, 0.10, 0.06);
            vec3 coralPink = vec3(0.25, 0.12, 0.10);
            vec3 coralOrng = vec3(0.22, 0.14, 0.06);
            vec3 coralPurp = vec3(0.14, 0.08, 0.16);
            vec3 kelpGreen = vec3(0.06, 0.12, 0.04);

            vec3 wetColor = mix(wetSandDk, wetSandMd, smoothstep(0.25, 0.45, n1));
            wetColor = mix(wetColor, wetSandLt, smoothstep(0.45, 0.65, n1));
            wetColor = mix(wetColor*0.82, wetColor*1.12, rippleVis*smoothstep(0.35,0.65,n1));
            wetColor *= 0.90 + nMicro * 0.20;
            // 암초
            float rockMask = smoothstep(0.58, 0.78, n2);
            vec2 vor = voronoi(vPos * 0.3);
            float rockCrack = smoothstep(0.04, 0.08, vor.y - vor.x);
            wetColor = mix(wetColor, mix(darkRock, darkRock*0.6, 1.0-rockCrack), rockMask*0.85);
            // 해조류
            float algaeMask = smoothstep(0.52, 0.70, fbm(vPos*0.40)) * rockMask;
            wetColor = mix(wetColor, greenRock, algaeMask * 0.70);
            // 철분 산화
            float rustMask = smoothstep(0.55,0.72, fbm(vPos*0.30+vec2(7.3,2.1)));
            wetColor = mix(wetColor, rustRock, rustMask*(1.0-rockMask)*0.40);
            // 산호초
            float coralMask = smoothstep(0.60, 0.78, n4) * smoothstep(0.45, 0.65, n2);
            float coralType = fbm(vPos*0.55+vec2(11.0,7.0));
            vec3 coralCol = mix(coralPink, coralOrng, smoothstep(0.3,0.6,coralType));
            coralCol = mix(coralCol, coralPurp, smoothstep(0.65,0.85,coralType));
            coralCol *= 0.85 + fbm(vPos*4.0)*0.3 + fbm(vPos*8.0)*0.15;
            wetColor = mix(wetColor, coralCol, coralMask * 0.75);
            // 해초
            float kelpNoise = fbm(vPos*0.20+vec2(2.5,9.1));
            float kelpMask = smoothstep(0.62,0.80,kelpNoise)*(1.0-rockMask*0.5);
            float kelpStrands = sin(vPos.x*2.5+fbm(vPos*0.8)*4.0)*0.5+0.5;
            kelpStrands *= smoothstep(0.4,0.7,kelpStrands);
            vec3 kelpCol = mix(kelpGreen, kelpGreen*1.4, kelpStrands);
            kelpCol += vec3(0.02,0.04,0.01)*fbm(vPos*3.0);
            wetColor = mix(wetColor, kelpCol, kelpMask*kelpStrands*0.65);
            // 조개 (젖은 곳, 어둡게)
            vec2 shellVor = voronoi(vPos*0.8);
            float shellMask = smoothstep(0.15,0.08,shellVor.x)*smoothstep(0.55,0.70,fbm(vPos*0.15+vec2(4.0,6.0)));
            wetColor = mix(wetColor, mix(vec3(0.25,0.23,0.18), vec3(0.30,0.28,0.32), fbm(vPos*6.0)), shellMask*0.55);
            // 불가사리
            vec2 starTile = fract(vPos*0.035)-vec2(0.5);
            vec2 starID = floor(vPos*0.035);
            float starRand = random(starID);
            if (starRand > 0.92) {
                float sa = starRand*6.28;
                float cs2 = cos(sa), sn2 = sin(sa);
                vec2 rt = vec2(starTile.x*cs2-starTile.y*sn2, starTile.x*sn2+starTile.y*cs2);
                float sf = starfishShape(rt, 0.18);
                vec3 sfCol = mix(vec3(0.30,0.08,0.04), vec3(0.35,0.15,0.05), starRand*3.0);
                sfCol += vec3(0.05)*fbm(vPos*20.0);
                wetColor = mix(wetColor, sfCol, sf*0.80);
            }
            // 웅덩이
            float puddleMask = smoothstep(0.66,0.78,fbm(vPos*0.90))*smoothstep(0.30,0.50,n1);
            wetColor = mix(wetColor, vec3(0.02,0.04,0.08), puddleMask*0.80);
            // 협곡
            float crevMask = smoothstep(0.02,0.0,abs(fbm(vPos*0.08)-0.5));
            crevMask += smoothstep(0.03,0.0,abs(fbm(vPos*0.12+vec2(3.7,8.2))-0.48))*0.6;
            wetColor = mix(wetColor, vec3(0.01,0.02,0.03), crevMask*0.85);

            // ═══════════════════════════════════════
            // ── 마른/젖은 블렌딩 ──
            // ═══════════════════════════════════════
            vec3 baseColor = mix(dryColor, wetColor, wetness);

            // ── 조명 (물속일 때 매우 어둡고 푸른빛, 마른 땅일 때 밝고 따뜻) ──
            vec3 moonDir = normalize(vec3(-0.69, 0.55, -0.46));
            float ambient = mix(0.48, 0.10, wetness);
            float diffStr = mix(0.90, 0.70, wetness);
            float diff = max(dot(norm, moonDir), 0.0) * diffStr + ambient;
            baseColor *= diff;

            // ═══════════════════════════════════════
            // ── 핵심: partProgress에 따른 전체 가시성 ──
            // partProgress=0 → 깊은 심해 (거의 검정, 물 밑에서 안 보임)
            // partProgress=1 → 마른 땅이 완전히 드러남
            // ═══════════════════════════════════════
            float reveal = smoothstep(0.05, 0.8, uPartProgress);
            vec3 deepOceanFloor = vec3(0.005, 0.008, 0.015);
            baseColor = mix(deepOceanFloor, baseColor, reveal);

            // ── 코스틱 (갈라진 후 젖은 구간만) ──
            float caust1 = caustic(vWorldPos.xz * 0.018);
            float caust2 = caustic(vWorldPos.xz * 0.035 + vec2(5.0,3.0));
            float caustMix = caust1*0.65 + caust2*0.35;
            vec3 caustCol = mix(vec3(0.15,0.25,0.45), vec3(0.25,0.40,0.60), caustMix);
            baseColor += caustCol * caustMix * wetness * reveal * 0.45;

            // ── 생물발광 (갈라진 후 젖은 구간만) ──
            float bioN1 = fbm(vPos*0.6+vec2(uTime*0.15,-uTime*0.1));
            float bioN2 = fbm(vPos*1.2+vec2(-uTime*0.2,uTime*0.08));
            float bioMask = smoothstep(0.62,0.80,bioN1)*smoothstep(0.55,0.72,bioN2);
            float bioPulse = (sin(uTime*3.0+bioN1*15.0)*0.5+0.5)*(sin(uTime*1.5+bioN2*8.0)*0.3+0.7);
            vec3 bioCol = mix(vec3(0.0,0.3,0.6), vec3(0.0,0.5,0.3), bioN1);
            baseColor += bioCol * bioMask * bioPulse * wetness * reveal * 0.35;
            // 산호 발광
            float cGlow = coralMask*(sin(uTime*2.0+n4*10.0)*0.5+0.5);
            baseColor += vec3(0.08,0.03,0.12)*cGlow*0.2*wetness*reveal;

            // ── 스페큘러 반사 (갈라진 후만) ──
            vec3 viewDir = normalize(cameraPosition - vWorldPos);
            vec3 halfV = normalize(moonDir + viewDir);
            // 젖은 반짝임
            float wSpecMask = (1.0-rockMask)*(1.0-algaeMask)*(1.0-coralMask);
            float wSpec = pow(max(dot(norm,halfV),0.0), 60.0)*wSpecMask;
            baseColor += vec3(0.15,0.20,0.32)*wSpec*wetness*reveal*0.55;
            // 웅덩이 반사
            float pSpec = pow(max(dot(norm,halfV),0.0), 180.0)*puddleMask;
            baseColor += vec3(0.55,0.70,1.00)*pSpec*wetness*reveal*1.0;
            // 조개 진주빛
            float sSpec = pow(max(dot(norm,halfV),0.0), 40.0)*max(shellMask, dShellMask);
            baseColor += vec3(0.30,0.28,0.35)*sSpec*reveal*0.35;
            // 산호 광택
            baseColor += vec3(0.10,0.06,0.08)*pow(max(dot(norm,halfV),0.0),25.0)*coralMask*wetness*reveal*0.35;
            // 마른 바위 약한 반사
            baseColor += vec3(0.12,0.10,0.08)*pow(max(dot(norm,halfV),0.0),30.0)*dryRockMask*(1.0-wetness)*reveal*0.20;

            // ── 물벽 바로 옆: 젖은 가장자리 (갈라졌을 때만) ──
            float edgeWet = smoothstep(uPathWidth + 20.0, uPathWidth, pathDist) * reveal;
            baseColor = mix(baseColor, baseColor*0.50, edgeWet*0.5);
            float edgeSpec = pow(max(dot(norm,halfV),0.0), 120.0)*edgeWet;
            baseColor += vec3(0.25,0.35,0.55)*edgeSpec*0.7;
            // 흘러내린 물자국
            float waterTrail = fbm(vPos*vec2(0.3,1.5)+vec2(0.0,-uTime*0.3));
            float trailMask = edgeWet*smoothstep(0.45,0.65,waterTrail);
            baseColor = mix(baseColor, baseColor*0.45+vec3(0.01,0.03,0.06), trailMask*0.5);

            gl_FragColor = vec4(baseColor, 1.0);
        }
    </script>

    <div id="container"></div>
    <div id="guideModal">
