    <script>
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const isMobile = isTouchDevice || window.innerWidth <= 768;
        if (isTouchDevice) {
            document.getElementById('guideText').textContent = 'Touch and drag to part the sea';
            document.getElementById('dragText').textContent = 'Drag your finger to widen the path!';
            document.body.style.cursor = 'auto';
        }

        // 1. 씬, 카메라, 렌더러 설정
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x010810, 500, 1800);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
        if (isMobile) {
            camera.position.set(0, 85, 280);
            camera.lookAt(0, 120, -300);
        } else {
            camera.position.set(0, 55, 220);
            camera.lookAt(0, 80, -300);
        }

        const renderer = new THREE.WebGLRenderer({ antialias: isMobile ? false : true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.0 : 2));
        renderer.domElement.style.display = 'block';
        document.getElementById('container').appendChild(renderer.domElement);

        // 2. 조명 — 밤하늘 조명
        const ambientLight = new THREE.AmbientLight(0x1a2d50, 2.8);
        scene.add(ambientLight);

        // 수평선 반대쪽 미세 채움
        const fillLight = new THREE.DirectionalLight(0x203060, 0.4);
        fillLight.position.set(100, 20, 100);
        scene.add(fillLight);

        // 하늘 위에서 오는 은은한 조명 (달 없이 별빛 + 잔광)
        const skyLight = new THREE.DirectionalLight(0xb0c8e8, 1.0);
        skyLight.position.set(-400, 600, -600);
        scene.add(skyLight);

        const skyPointLight = new THREE.PointLight(0x8898bb, 1.5, 3000);
        skyPointLight.position.set(-400, 500, -600);
        scene.add(skyPointLight);

        // ── 반짝이는 별 파티클 ──
        const starCount = isMobile ? 1500 : 6000;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starPhases = new Float32Array(starCount);
        const starSizes = new Float32Array(starCount);
        const starSpeeds = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi   = Math.acos(Math.random() * 0.85);
            const r     = 1100 + Math.random() * 300;
            starPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i*3+1] = r * Math.cos(phi);
            starPositions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
            starPhases[i] = Math.random() * Math.PI * 2;
            starSizes[i] = 1.2 + Math.random() * 3.5;
            starSpeeds[i] = 0.5 + Math.random() * 3.0;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhases, 1));
        starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));
        starGeo.setAttribute('aSpeed', new THREE.BufferAttribute(starSpeeds, 1));

        const starUniforms = { uTime: { value: 0.0 } };
        const starMat = new THREE.ShaderMaterial({
            uniforms: starUniforms,
            vertexShader: `
                attribute float aPhase;
                attribute float aSize;
                attribute float aSpeed;
                uniform float uTime;
                varying float vAlpha;
                varying float vSize;
                void main() {
                    // 3겹 트윙클: 느린 맥동 + 중간 깜빡 + 빠른 섬광
                    float slow  = sin(uTime * aSpeed * 0.6 + aPhase * 6.283) * 0.5 + 0.5;
                    float mid   = sin(uTime * aSpeed * 1.8 + aPhase * 3.14) * 0.5 + 0.5;
                    float fast  = sin(uTime * aSpeed * 4.5 + aPhase * 9.42) * 0.5 + 0.5;
                    // 세 겹을 곱해서 극적인 명멸 (0에 가까운 순간 생김)
                    float combined = slow * mid * 0.7 + fast * 0.3;
                    // 간헐적 밝은 섬광 — pow로 대부분 어둡게, 가끔 확 밝게
                    vAlpha = pow(combined, 1.5);
                    // 크기도 밝기에 따라 팽창
                    vSize = aSize * (0.6 + vAlpha * 0.8);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = vSize * (700.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                varying float vSize;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    if (d > 0.5) discard;

                    // 중심 코어 (밝고 뜨거운 백색)
                    float core = exp(-d * d * 40.0);
                    // 부드러운 글로우
                    float glow = exp(-d * d * 8.0);
                    // 십자형 스파이크 (밝은 별에만)
                    float spike = 0.0;
                    if (vAlpha > 0.5) {
                        float sx = exp(-abs(uv.y) * 18.0) * exp(-abs(uv.x) * 6.0);
                        float sy = exp(-abs(uv.x) * 18.0) * exp(-abs(uv.y) * 6.0);
                        spike = (sx + sy) * (vAlpha - 0.5) * 1.2;
                    }

                    float brightness = core * 1.2 + glow * 0.6 + spike;
                    // 밝은 별은 따뜻하게, 어두운 별은 차갑게
                    vec3 warmCol = vec3(1.0, 0.95, 0.85);
                    vec3 coolCol = vec3(0.8, 0.88, 1.0);
                    vec3 col = mix(coolCol, warmCol, vAlpha * vAlpha);

                    gl_FragColor = vec4(col * brightness, brightness * vAlpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const starPoints = new THREE.Points(starGeo, starMat);
        scene.add(starPoints);

        // ═══════════════════════════════════════════
        // ── NEW: 커스텀 커서 추적 ──
        // ═══════════════════════════════════════════
        const screenFlashEl = document.getElementById('screenFlash');
        const subtitleEl = document.getElementById('subtitle');
        let subtitleShown = false;
        let introSubtitleDone = false;

        // 로딩 후 자막 페이드인 → 페이드아웃
        setTimeout(() => {
            subtitleEl.classList.add('visible');
            setTimeout(() => {
                subtitleEl.classList.remove('visible');
                subtitleEl.classList.add('fadeout');
                setTimeout(() => {
                    subtitleEl.classList.remove('fadeout');
                    introSubtitleDone = true;
                }, 2500);
            }, 4000);
        }, 1500);
        window.addEventListener('mousemove', (e) => {
            // cursor tracking removed — staff acts as cursor
        });

        // ═══════════════════════════════════════════
        // ── NEW: 오로라 (Aurora Borealis) ──
        // ═══════════════════════════════════════════
        const auroraGeo = new THREE.PlaneGeometry(2500, 400, 80, 20);
        const auroraUniforms = { uTime: { value: 0.0 }, uIntensity: { value: 0.3 } };
        const auroraMat = new THREE.ShaderMaterial({
            uniforms: auroraUniforms,
            vertexShader: `
                uniform float uTime;
                varying vec2 vUv;
                varying float vDisp;
                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float wave = sin(pos.x * 0.004 + uTime * 0.3) * 40.0
                               + cos(pos.x * 0.007 - uTime * 0.2) * 25.0
                               + sin(pos.x * 0.012 + uTime * 0.5) * 15.0;
                    pos.y += wave * uv.y;
                    pos.z += sin(pos.x * 0.005 + uTime * 0.15) * 20.0;
                    vDisp = wave / 80.0;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uIntensity;
                varying vec2 vUv;
                varying float vDisp;
                void main() {
                    float vFade = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.5, vUv.y);
                    float hFade = smoothstep(0.0, 0.2, vUv.x) * smoothstep(1.0, 0.8, vUv.x);
                    float curtain = sin(vUv.x * 30.0 + uTime * 1.5 + vDisp * 5.0) * 0.5 + 0.5;
                    curtain *= sin(vUv.x * 15.0 - uTime * 0.8) * 0.5 + 0.5;
                    float flicker = 0.7 + sin(uTime * 2.0 + vUv.x * 10.0) * 0.3;
                    vec3 green = vec3(0.1, 0.8, 0.4);
                    vec3 blue = vec3(0.2, 0.3, 0.9);
                    vec3 purple = vec3(0.5, 0.1, 0.7);
                    float t = vUv.y + vDisp * 0.3;
                    vec3 col = mix(green, blue, smoothstep(0.2, 0.6, t));
                    col = mix(col, purple, smoothstep(0.5, 0.9, t));
                    float alpha = vFade * hFade * curtain * flicker * uIntensity * 0.35;
                    gl_FragColor = vec4(col, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const aurora = new THREE.Mesh(auroraGeo, auroraMat);
        aurora.position.set(0, 550, -700);
        aurora.rotation.x = -0.2;
        scene.add(aurora);

        // ═══════════════════════════════════════════
        // ── NEW: 번개 시스템 (Lightning) ──
        // ═══════════════════════════════════════════
        const lightningBolts = [];
        const maxBolts = isMobile ? 2 : 5;
        const lightningFlashLight = new THREE.PointLight(0xaabbff, 0, 2000);
        lightningFlashLight.position.set(0, 400, -300);
        scene.add(lightningFlashLight);

        function createLightningBolt() {
            const startX = (Math.random() - 0.5) * 800;
            const startY = 600 + Math.random() * 200;
            const startZ = -300 + (Math.random() - 0.5) * 400;
            const endY = 50 + Math.random() * 100;
            const segments = 12 + Math.floor(Math.random() * 8);
            const points = [];
            const spread = 60;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = startX + (Math.random() - 0.5) * spread * (1 - t * 0.3);
                const y = THREE.MathUtils.lerp(startY, endY, t);
                const z = startZ + (Math.random() - 0.5) * spread * 0.5;
                points.push(new THREE.Vector3(x, y, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, segments * 3, 1.2, 4, false);
            const material = new THREE.MeshBasicMaterial({
                color: 0xccddff,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const bolt = new THREE.Mesh(geometry, material);

            // 가지 번개 (branches)
            const branchGroup = new THREE.Group();
            branchGroup.add(bolt);
            const branchCount = 2 + Math.floor(Math.random() * 3);
            for (let b = 0; b < branchCount; b++) {
                const branchStart = Math.floor(Math.random() * (segments - 2)) + 1;
                const startPt = points[branchStart];
                const bSegs = 4 + Math.floor(Math.random() * 4);
                const bPts = [startPt.clone()];
                for (let j = 1; j <= bSegs; j++) {
                    const bt = j / bSegs;
                    bPts.push(new THREE.Vector3(
                        startPt.x + (Math.random() - 0.5) * 120 * bt,
                        startPt.y - bt * (80 + Math.random() * 60),
                        startPt.z + (Math.random() - 0.5) * 60 * bt
                    ));
                }
                const bCurve = new THREE.CatmullRomCurve3(bPts);
                const bGeo = new THREE.TubeGeometry(bCurve, bSegs * 2, 0.5, 3, false);
                const bMat = new THREE.MeshBasicMaterial({
                    color: 0x99aadd,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                branchGroup.add(new THREE.Mesh(bGeo, bMat));
            }

            // 글로우 튜브
            const glowGeo = new THREE.TubeGeometry(curve, segments * 2, 8, 6, false);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x4466aa,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            branchGroup.add(new THREE.Mesh(glowGeo, glowMat));

            scene.add(branchGroup);
            return {
                group: branchGroup,
                life: 1.0,
                decay: 0.04 + Math.random() * 0.03,
                flickerPhase: 0,
                pos: new THREE.Vector3(startX, startY, startZ)
            };
        }

        let lightningTimer = 0;
        let nextLightningTime = 3 + Math.random() * 4;
        let cameraShake = new THREE.Vector3();
        let shakeIntensity = 0;

        // ═══════════════════════════════════════════
        // ── NEW: God Rays (하늘에서 내려오는 빛줄기) ──
        // ═══════════════════════════════════════════
        const godRayCount = isMobile ? 3 : 8;
        const godRays = [];
        for (let i = 0; i < godRayCount; i++) {
            const rayGeo = new THREE.CylinderGeometry(0, 60 + Math.random() * 40, 800, 8, 1, true);
            const rayMat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uAlpha: { value: 0 } },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uAlpha;
                    varying vec2 vUv;
                    void main() {
                        float fade = smoothstep(0.0, 0.15, vUv.y) * smoothstep(1.0, 0.4, vUv.y);
                        float radial = 1.0 - abs(vUv.x - 0.5) * 2.0;
                        radial = pow(radial, 2.0);
                        float flicker = 0.7 + sin(uTime * 1.5 + vUv.y * 3.0) * 0.3;
                        vec3 col = mix(vec3(0.6, 0.7, 1.0), vec3(1.0, 0.95, 0.8), vUv.y);
                        float alpha = fade * radial * flicker * uAlpha * 0.12;
                        gl_FragColor = vec4(col, alpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const ray = new THREE.Mesh(rayGeo, rayMat);
            ray.position.set(
                (Math.random() - 0.5) * 600,
                400,
                -200 + (Math.random() - 0.5) * 400
            );
            ray.rotation.x = (Math.random() - 0.5) * 0.15;
            ray.rotation.z = (Math.random() - 0.5) * 0.2;
            scene.add(ray);
            godRays.push({ mesh: ray, phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.5 });
        }

        // ── EXODUS 3D 볼류메트릭 파티클 타이틀 ──
        const titleCanvas = document.createElement('canvas');
        titleCanvas.width = 1024;
        titleCanvas.height = 256;
        const tCtx = titleCanvas.getContext('2d');
        tCtx.fillStyle = '#000';
        tCtx.fillRect(0, 0, 1024, 256);
        tCtx.fillStyle = '#fff';
        tCtx.font = 'bold 180px Cinzel, serif';
        tCtx.textAlign = 'center';
        tCtx.textBaseline = 'middle';
        tCtx.fillText('EXODUS', 512, 128);

        const imgData = tCtx.getImageData(0, 0, 1024, 256).data;
        const titlePoints2D = [];
        const sampleStep = 2;
        for (let y = 0; y < 256; y += sampleStep) {
            for (let x = 0; x < 1024; x += sampleStep) {
                const brightness = imgData[(y * 1024 + x) * 4];
                if (brightness > 128) {
                    titlePoints2D.push({
                        x: (x - 512) * 1.0,
                        y: -(y - 128) * 1.0,
                        edge: brightness < 240 ? 1 : 0  // 가장자리 감지
                    });
                }
            }
        }

        // 3D 깊이: 여러 레이어에 걸쳐 파티클 분포
        const depthLayers = 5;
        const depthSpread = 50;
        const titlePoints3D = [];
        for (let i = 0; i < titlePoints2D.length; i++) {
            const p = titlePoints2D[i];
            // 내부 파티클은 깊이 범위 전체, 가장자리는 모든 레이어에
            const layers = p.edge ? depthLayers : Math.ceil(Math.random() * depthLayers);
            for (let l = 0; l < layers; l++) {
                // 중심이 더 밀집, 가장자리로 갈수록 스파스
                const zOff = (l / (depthLayers - 1) - 0.5) * depthSpread;
                const jitter = p.edge ? 1.5 : 3.0;
                titlePoints3D.push({
                    x: p.x + (Math.random() - 0.5) * jitter,
                    y: p.y + (Math.random() - 0.5) * jitter,
                    z: zOff + (Math.random() - 0.5) * 8,
                    layer: l / (depthLayers - 1)  // 0=뒤, 1=앞
                });
            }
        }

        // 간솎기: 너무 많으면 랜덤 샘플링
        const maxTitlePts = isMobile ? 12000 : 40000;
        let finalTitlePts = titlePoints3D;
        if (titlePoints3D.length > maxTitlePts) {
            finalTitlePts = [];
            for (let i = 0; i < maxTitlePts; i++) {
                finalTitlePts.push(titlePoints3D[Math.floor(Math.random() * titlePoints3D.length)]);
            }
        }

        const titleCount = finalTitlePts.length;
        const titlePosArr = new Float32Array(titleCount * 3);
        const titlePhases = new Float32Array(titleCount);
        const titleBaseSizes = new Float32Array(titleCount);
        const titleLayers = new Float32Array(titleCount);

        const titleY = isMobile ? 200 : 150;
        const titleZ = -300;
        for (let i = 0; i < titleCount; i++) {
            titlePosArr[i * 3]     = finalTitlePts[i].x;
            titlePosArr[i * 3 + 1] = titleY + finalTitlePts[i].y;
            titlePosArr[i * 3 + 2] = titleZ + finalTitlePts[i].z;
            titlePhases[i] = Math.random() * Math.PI * 2;
            titleBaseSizes[i] = 1.2 + Math.random() * 2.0;
            titleLayers[i] = finalTitlePts[i].layer;
        }

        const titleGeo = new THREE.BufferGeometry();
        titleGeo.setAttribute('position', new THREE.BufferAttribute(titlePosArr, 3));
        titleGeo.setAttribute('aPhase', new THREE.BufferAttribute(titlePhases, 1));
        titleGeo.setAttribute('aSize', new THREE.BufferAttribute(titleBaseSizes, 1));
        titleGeo.setAttribute('aLayer', new THREE.BufferAttribute(titleLayers, 1));

        const titleUniforms = { uTime: { value: 0.0 } };
        const titleMat = new THREE.ShaderMaterial({
            uniforms: titleUniforms,
            vertexShader: `
                attribute float aPhase;
                attribute float aSize;
                attribute float aLayer;
                uniform float uTime;
                varying float vAlpha;
                varying float vLayer;
                void main() {
                    vLayer = aLayer;
                    float t1 = sin(uTime * 2.0 + aPhase * 6.28) * 0.5 + 0.5;
                    float t2 = sin(uTime * 4.5 + aPhase * 3.14) * 0.5 + 0.5;
                    float t3 = sin(uTime * 7.0 + aPhase * 9.42) * 0.5 + 0.5;
                    vAlpha = 0.4 + t1 * t2 * 0.4 + t3 * 0.2;
                    // 앞쪽 레이어가 더 밝고 큼
                    vAlpha *= 0.6 + aLayer * 0.4;
                    float sz = aSize * (0.7 + t1 * 0.4) * (0.7 + aLayer * 0.3);
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = sz * (450.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                varying float vLayer;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    if (d > 0.5) discard;
                    float core = exp(-d * d * 30.0);
                    float glow = exp(-d * d * 7.0);
                    // 십자 스파이크 (앞쪽 레이어만)
                    float spike = 0.0;
                    if (vLayer > 0.6) {
                        float sx = exp(-abs(uv.y) * 22.0) * exp(-abs(uv.x) * 5.0);
                        float sy = exp(-abs(uv.x) * 22.0) * exp(-abs(uv.y) * 5.0);
                        spike = (sx + sy) * 0.3 * vAlpha;
                    }
                    float brightness = core * 1.3 + glow * 0.5 + spike;
                    // 뒤쪽 = 차가운 청색, 앞쪽 = 따뜻한 금백색
                    vec3 backCol = vec3(0.5, 0.6, 1.0);
                    vec3 frontCol = vec3(1.0, 0.95, 0.85);
                    vec3 col = mix(backCol, frontCol, vLayer);
                    gl_FragColor = vec4(col * brightness, brightness * vAlpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const titleParticles = new THREE.Points(titleGeo, titleMat);
        const mobileTitleScale = Math.min(window.innerWidth / 1024, 1.0);
        const titleScaleFactor = isMobile ? Math.max(mobileTitleScale * 0.7, 0.35) : 1.0;
        titleParticles.scale.setScalar(titleScaleFactor);
        scene.add(titleParticles);

        // ── EXODUS 뒤 글로우 ──
        const titleGlowGeo = new THREE.PlaneGeometry(700, 200);
        const titleGlowMat = new THREE.ShaderMaterial({
            uniforms: { uTime: titleUniforms.uTime },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    vec2 c = vUv - vec2(0.5);
                    float d = length(c * vec2(1.0, 1.8));
                    float glow = exp(-d * d * 6.0);
                    float pulse = 0.85 + sin(uTime * 1.5) * 0.15;
                    vec3 col = mix(vec3(0.1, 0.15, 0.35), vec3(0.3, 0.4, 0.7), glow);
                    gl_FragColor = vec4(col, glow * 0.25 * pulse);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const titleGlow = new THREE.Mesh(titleGlowGeo, titleGlowMat);
        titleGlow.position.set(0, titleY, titleZ - 5);
        titleGlow.scale.setScalar(titleScaleFactor);
        scene.add(titleGlow);

        // ── EXODUS 수면 반사 (2D 투영) ──
        const reflCount = titlePoints2D.length;
        const reflPosArr = new Float32Array(reflCount * 3);
        const reflPhases = new Float32Array(reflCount);
        const reflBaseSizes = new Float32Array(reflCount);
        for (let i = 0; i < reflCount; i++) {
            reflPosArr[i * 3]     = titlePoints2D[i].x;
            reflPosArr[i * 3 + 1] = -3;
            reflPosArr[i * 3 + 2] = titleZ + (titleY + titlePoints2D[i].y) * -0.6;
            reflPhases[i] = Math.random() * Math.PI * 2;
            reflBaseSizes[i] = 1.5 + Math.random() * 2.0;
        }

        const reflGeo = new THREE.BufferGeometry();
        reflGeo.setAttribute('position', new THREE.BufferAttribute(reflPosArr, 3));
        reflGeo.setAttribute('aPhase', new THREE.BufferAttribute(reflPhases, 1));
        reflGeo.setAttribute('aSize', new THREE.BufferAttribute(reflBaseSizes, 1));

        const reflUniforms = { uTime: { value: 0.0 }, uFade: { value: 1.0 } };
        const reflMat = new THREE.ShaderMaterial({
            uniforms: reflUniforms,
            vertexShader: `
                attribute float aPhase;
                attribute float aSize;
                uniform float uTime;
                varying float vAlpha;
                void main() {
                    vec3 pos = position;
                    // 물결 일렁임 (더 크게)
                    pos.x += sin(uTime * 1.5 + pos.z * 0.015 + aPhase) * 3.5;
                    pos.z += cos(uTime * 1.2 + pos.x * 0.008 + aPhase * 0.7) * 2.5;
                    pos.y += sin(uTime * 2.0 + aPhase * 2.0) * 0.8;

                    float t1 = sin(uTime * 2.0 + aPhase * 6.28) * 0.5 + 0.5;
                    float t2 = sin(uTime * 3.5 + aPhase * 3.14) * 0.5 + 0.5;
                    vAlpha = 0.2 + t1 * t2 * 0.3;
                    float sz = aSize * (0.6 + t1 * 0.3);
                    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = sz * (400.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                uniform float uFade;
                varying float vAlpha;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    if (d > 0.5) discard;
                    float glow = exp(-d * d * 5.0);
                    vec3 col = vec3(0.65, 0.75, 1.0);
                    gl_FragColor = vec4(col * glow, glow * vAlpha * uFade);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const reflParticles = new THREE.Points(reflGeo, reflMat);
        reflParticles.scale.setScalar(titleScaleFactor);
        scene.add(reflParticles);

        // 3. 지팡이 — 단순한 나무 지팡이
        const staffGroup = new THREE.Group();

        const woodMat = new THREE.MeshStandardMaterial({
            color: 0x5C3510, roughness: 0.95, metalness: 0.0
        });
        const woodDarkMat = new THREE.MeshStandardMaterial({
            color: 0x3A2008, roughness: 1.0, metalness: 0.0
        });
        // 더미 gemMat (애니메이션 루프 참조용)
        const gemMat = { emissiveIntensity: 0 };

        // 메인 자루 — 아래가 굵고 위가 가는 자연목
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 2.8, 150, 9), woodMat);
        staffGroup.add(shaft);

        // 자연스러운 옹이 2~3개
        [{ y: -40, s: 3.2 }, { y: 10, s: 2.6 }, { y: 50, s: 2.0 }].forEach(k => {
            const kn = new THREE.Mesh(new THREE.SphereGeometry(k.s, 7, 5), woodDarkMat);
            kn.position.y = k.y;
            kn.scale.set(1, 0.5, 1);
            staffGroup.add(kn);
        });

        // 하단 — 땅에 닿아 닳은 끝
        const tipMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.5, 8, 7), woodDarkMat);
        tipMesh.position.y = -78;
        staffGroup.add(tipMesh);

        // 상단 — 손잡이 쪽 굵어지는 마디
        const topKnot = new THREE.Mesh(new THREE.SphereGeometry(3.0, 8, 6), woodDarkMat);
        topKnot.position.y = 75;
        topKnot.scale.set(1, 0.7, 1);
        staffGroup.add(topKnot);

        const staffLight = new THREE.PointLight(0xffaa44, 8, 400);
        staffLight.position.y = 75;
        staffGroup.add(staffLight);

        // 지팡이 상단 발광 오브
        const glowOrbGeo = new THREE.SphereGeometry(5, 16, 16);
        const glowOrbMat = new THREE.MeshBasicMaterial({
            color: 0xffcc66,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const glowOrb = new THREE.Mesh(glowOrbGeo, glowOrbMat);
        glowOrb.position.y = 75;
        staffGroup.add(glowOrb);

        // 지팡이 넓은 후광
        const staffHaloGeo = new THREE.SphereGeometry(18, 16, 16);
        const staffHaloMat = new THREE.MeshBasicMaterial({
            color: 0xff8833,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const staffHalo = new THREE.Mesh(staffHaloGeo, staffHaloMat);
        staffHalo.position.y = 75;
        staffGroup.add(staffHalo);

        scene.add(staffGroup);
        // 지팡이가 항상 물 위에 보이도록 렌더 순서 설정
        staffGroup.renderOrder = 10;
        staffGroup.traverse(child => {
            if (child.isMesh) {
                child.renderOrder = 10;
                child.material.depthTest = true;
            }
        });

        // 4. 바다 (Sea)
        const seaSub = isMobile ? 160 : 420;
        const seaGeo = new THREE.PlaneGeometry(4000, 4000, seaSub, seaSub);

        const waterUniforms = {
            time: { value: 0.0 },
            partProgress: { value: 0.0 },
            pathWidth: { value: 10.0 },
            waterColor: { value: new THREE.Color(0x052030) },
            wallColor: { value: new THREE.Color(0x5a8a9a) },
            staffPos: { value: new THREE.Vector3(0, 0, 0) }
        };

        const seaMat = new THREE.ShaderMaterial({
            uniforms: waterUniforms,
            vertexShader: document.getElementById('waterVertexShader').textContent,
            fragmentShader: document.getElementById('waterFragmentShader').textContent,
            transparent: true,
            wireframe: false,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        scene.add(sea);

        // 5. 마른 땅 (Ground)
        const groundSub = isMobile ? 120 : 300;
        const groundGeo = new THREE.PlaneGeometry(4000, 4000, groundSub, groundSub);
        const groundUniforms = { uTime: { value: 0.0 }, uPathWidth: { value: 10.0 }, uPartProgress: { value: 0.0 } };
        const groundMat = new THREE.ShaderMaterial({
            uniforms: groundUniforms,
            vertexShader: document.getElementById('groundVertexShader').textContent,
            fragmentShader: document.getElementById('groundFragmentShader').textContent,
            transparent: false,
            wireframe: false
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 6. 파티클 시스템 (물보라 + 미스트 + 낙하 물방울) — 강화됨
        const particleCount = isMobile ? 1500 : 6000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleAlphas = new Float32Array(particleCount);
        const particleVels = [];
        const particleTypes = []; // 0: spray, 1: mist, 2: cascade
        for (let i = 0; i < particleCount; i++) {
            particlePos[i * 3] = 0; particlePos[i * 3 + 1] = -1000; particlePos[i * 3 + 2] = 0;
            particleVels.push(new THREE.Vector3(0, 0, 0));
            particleSizes[i] = 2.0;
            particleAlphas[i] = 0.6;
            particleTypes.push(0);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        // 물보라 셰이더 (사이즈 + 부드러운 원)
        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(0xaaccee) }
            },
            vertexShader: `
                attribute float size;
                varying float vSize;
                void main() {
                    vSize = size;
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vSize;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float alpha = (1.0 - smoothstep(0.0, 0.5, d)) * 0.7;
                    // 작은 입자 → 더 투명 (미스트 느낌)
                    alpha *= clamp(vSize / 4.0, 0.2, 1.0);
                    gl_FragColor = vec4(uColor, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        particles.frustumCulled = false;
        scene.add(particles);

        // 6-b. 물벽 내부 조명 (갈라질 때 활성화)
        const wallLightL = new THREE.PointLight(0x2255aa, 0, 600);
        wallLightL.position.set(-80, 40, -50);
        scene.add(wallLightL);
        const wallLightR = new THREE.PointLight(0x2255aa, 0, 600);
        wallLightR.position.set(80, 40, -50);
        scene.add(wallLightR);

        // 6-c. 별똥별 시스템 (화려한 유성우)
        const meteorMax = isMobile ? 6 : 20;
        const trailLen = isMobile ? 8 : 15;
        const meteorTotalVerts = meteorMax * trailLen;
        const meteorGeo = new THREE.BufferGeometry();
        const mPos = new Float32Array(meteorTotalVerts * 3);
        const mSizes = new Float32Array(meteorTotalVerts);
        const mAlphas = new Float32Array(meteorTotalVerts);
        for (let i = 0; i < meteorTotalVerts; i++) {
            mPos[i * 3 + 1] = -9999;
            mSizes[i] = 0;
            mAlphas[i] = 0;
        }
        meteorGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
        meteorGeo.setAttribute('size', new THREE.BufferAttribute(mSizes, 1));
        meteorGeo.setAttribute('alpha', new THREE.BufferAttribute(mAlphas, 1));

        const meteorMat = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float size;
                attribute float alpha;
                varying float vAlpha;
                void main() {
                    vAlpha = alpha;
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = max(size * (800.0 / -mv.z), 2.0);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    if (d > 0.5) discard;
                    float core = exp(-d * d * 15.0);
                    float glow = exp(-d * d * 3.5);
                    float brightness = core * 2.0 + glow * 0.8;
                    vec3 col = mix(vec3(0.5, 0.6, 1.0), vec3(1.0, 0.98, 0.90), core);
                    gl_FragColor = vec4(col * brightness, brightness * vAlpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const meteorPoints = new THREE.Points(meteorGeo, meteorMat);
        meteorPoints.frustumCulled = false;  // ★ 핵심: frustum culling 비활성화
        scene.add(meteorPoints);

        // 유성 데이터
        const meteors = [];
        for (let i = 0; i < meteorMax; i++) {
            meteors.push({
                active: false,
                x: 0, y: 0, z: 0,
                vx: 0, vy: 0, vz: 0,
                life: 0,
                trail: [] // [{x,y,z}, ...]
            });
        }
        let meteorSpawnTimer = 0;

        // 7. 영화 같은 발광(Bloom) 포스트 프로세싱 적용
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        const bloomRes = isMobile
            ? new THREE.Vector2(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2))
            : new THREE.Vector2(window.innerWidth, window.innerHeight);
        const bloomPass = new THREE.UnrealBloomPass(bloomRes, isMobile ? 1.5 : 2.2, 0.5, isMobile ? 0.7 : 0.55);
        composer.addPass(bloomPass);

        // 8. 인터랙션 및 상태 관리
        let isParting = false;
        let partProgress = 0;
        let targetPathWidth = 10.0;
        let currentPathWidth = 10.0;

        const mouse = new THREE.Vector2();
        let pIndex = 0;

        // 모달 제어
        const guideModal = document.getElementById('guideModal');
        const dragHint = document.getElementById('dragHint');
        let modalShown = false;
        let modalDismissed = false;
        let holdTimer = null;
        let dragHintShown = false;
        let movedWhileHolding = false;

        let lastTouchX = 0;
        let lastTouchY = 0;

        function handlePointerMove(clientX, clientY, movementX, movementY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            if (!modalShown) {
                modalShown = true;
                setTimeout(() => {
                    guideModal.classList.add('visible');
                }, 300);
            }

            if (isParting) {
                const movePower = Math.sqrt(movementX ** 2 + movementY ** 2);
                targetPathWidth += movePower * 0.8;
                targetPathWidth = Math.min(targetPathWidth, 320.0);

                if (movePower > 3) {
                    movedWhileHolding = true;
                    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                    if (dragHintShown) {
                        dragHintShown = false;
                        dragHint.classList.remove('visible');
                        dragHint.classList.add('fadeout');
                    }
                }
            }
        }

        function handlePointerDown(clientX, clientY) {
            isParting = true;
            targetPathWidth = 80.0;
            movedWhileHolding = false;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            if (!modalDismissed && modalShown) {
                modalDismissed = true;
                guideModal.classList.remove('visible');
                guideModal.classList.add('fadeout');
                setTimeout(() => { guideModal.style.display = 'none'; }, 1000);
            }

            holdTimer = setTimeout(() => {
                if (!movedWhileHolding && isParting) {
                    dragHintShown = true;
                    dragHint.classList.remove('fadeout');
                    dragHint.classList.add('visible');
                }
            }, 1000);
        }

        function handlePointerUp() {
            isParting = false;
            targetPathWidth = 10.0;
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (dragHintShown) {
                dragHintShown = false;
                dragHint.classList.remove('visible');
                dragHint.classList.add('fadeout');
            }
        }

        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY, e.movementX, e.movementY);
        });
        window.addEventListener('mousedown', (e) => {
            handlePointerDown(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
            handlePointerDown(t.clientX, t.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX - lastTouchX;
            const dy = t.clientY - lastTouchY;
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
            handlePointerMove(t.clientX, t.clientY, dx, dy);
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            e.preventDefault();
            handlePointerUp();
        }, { passive: false });

        window.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            handlePointerUp();
        }, { passive: false });

        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 150);
        });

        const raycaster = new THREE.Raycaster();
        const targetPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -20);
        const targetPos = new THREE.Vector3();

        // 9. 애니메이션 루프
        const clock = new THREE.Clock();
        const targetCameraPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            waterUniforms.time.value = time;
            starUniforms.uTime.value = time;
            titleUniforms.uTime.value = time;
            reflUniforms.uTime.value = time;
            groundUniforms.uTime.value = time;
            groundUniforms.uPathWidth.value = currentPathWidth;
            groundUniforms.uPartProgress.value = partProgress;

            // ── NEW: 동적 안개 (갈라질수록 안개가 걷힘) ──
            scene.fog.far = THREE.MathUtils.lerp(1800, 2500, partProgress);
            scene.fog.near = THREE.MathUtils.lerp(500, 800, partProgress);

            // ── EXODUS 타이틀: 물이 갈라지면 하늘 위로 이동하며 작아짐 ──
            const titleBaseY = titleY;
            const titleLiftY = isMobile ? 500 : 450;
            const titleTargetY = THREE.MathUtils.lerp(titleBaseY, titleLiftY, partProgress);
            titleParticles.position.y = titleTargetY - titleBaseY;
            const titleScale = THREE.MathUtils.lerp(titleScaleFactor, titleScaleFactor * 0.45, partProgress);
            titleParticles.scale.setScalar(titleScale);
            // 후광도 같이 이동
            titleGlow.position.y = titleTargetY;
            titleGlow.scale.setScalar(titleScale);
            // 반사는 갈라지면 점점 사라짐
            reflUniforms.uFade.value = 1.0 - partProgress * 0.8;

            // ── 별똥별 유성우 (은은하게, 하늘 위쪽만) ──
            meteorSpawnTimer += 0.016;
            if (isParting && partProgress > 0.15) {
                if (meteorSpawnTimer > 0.15) {
                    meteorSpawnTimer = 0;
                    const spawnN = 1 + Math.floor(Math.random() * 2);
                    for (let s = 0; s < spawnN; s++) {
                        for (let mi = 0; mi < meteorMax; mi++) {
                            if (!meteors[mi].active) {
                                const m = meteors[mi];
                                m.active = true;
                                // EXODUS(y~150) 위쪽 하늘에서만 생성
                                m.x = (Math.random() - 0.5) * 1200;
                                m.y = 350 + Math.random() * 500;
                                m.z = -200 + Math.random() * -500;
                                const speed = 3 + Math.random() * 5;
                                m.vx = (Math.random() - 0.5) * speed;
                                m.vy = -(0.4 + Math.random() * 0.3) * speed;
                                m.vz = (Math.random() - 0.5) * 2;
                                m.life = 1.0;
                                m.trail = [];
                                break;
                            }
                        }
                    }
                }
            }

            // 유성 업데이트 & 버퍼 쓰기
            const mp = meteorGeo.attributes.position.array;
            const ms = meteorGeo.attributes.size.array;
            const ma = meteorGeo.attributes.alpha.array;

            for (let mi = 0; mi < meteorMax; mi++) {
                const m = meteors[mi];
                const base = mi * trailLen;

                if (m.active) {
                    m.x += m.vx;
                    m.y += m.vy;
                    m.z += m.vz;
                    m.life -= 0.012;

                    m.trail.unshift({ x: m.x, y: m.y, z: m.z });
                    if (m.trail.length > trailLen) m.trail.length = trailLen;

                    // EXODUS 높이(~250) 이상에서만 유지, 그 아래로 내려가면 소멸
                    if (m.life <= 0 || m.y < 220) {
                        m.active = false;
                    }

                    for (let t = 0; t < trailLen; t++) {
                        const vi = base + t;
                        if (t < m.trail.length) {
                            const fade = 1.0 - (t / m.trail.length);
                            mp[vi * 3]     = m.trail[t].x;
                            mp[vi * 3 + 1] = m.trail[t].y;
                            mp[vi * 3 + 2] = m.trail[t].z;
                            ms[vi] = (t === 0 ? 5.0 : 3.0 * fade) * Math.max(m.life, 0);
                            ma[vi] = fade * fade * Math.max(m.life, 0) * 0.8;
                        } else {
                            mp[vi * 3 + 1] = -9999;
                            ma[vi] = 0;
                        }
                    }
                } else {
                    for (let t = 0; t < trailLen; t++) {
                        const vi = base + t;
                        mp[vi * 3 + 1] = -9999;
                        ma[vi] = 0;
                        ms[vi] = 0;
                    }
                }
            }
            meteorGeo.attributes.position.needsUpdate = true;
            meteorGeo.attributes.size.needsUpdate = true;
            meteorGeo.attributes.alpha.needsUpdate = true;

            // 지팡이 발광 맥동
            const staffPulse = 0.7 + Math.sin(time * 2.5) * 0.3;
            glowOrb.material.opacity = 0.5 + staffPulse * 0.3;
            glowOrb.scale.setScalar(1.0 + Math.sin(time * 3.0) * 0.15);
            staffHalo.scale.setScalar(1.0 + Math.sin(time * 1.8) * 0.1);

            // ═══════════════════════════════════════════
            // ── NEW: 자막 표시 (물 갈라질 때 다시 표시) ──
            // ═══════════════════════════════════════════
            if (introSubtitleDone && !subtitleShown && partProgress > 0.5) {
                subtitleShown = true;
                subtitleEl.classList.remove('fadeout');
                subtitleEl.classList.add('visible');
                setTimeout(() => {
                    subtitleEl.classList.remove('visible');
                    subtitleEl.classList.add('fadeout');
                }, 5000);
            }
            if (subtitleShown && !isParting && partProgress < 0.1) {
                subtitleShown = false;
                subtitleEl.classList.remove('visible', 'fadeout');
            }

            // ═══════════════════════════════════════════
            // ── NEW: 오로라 애니메이션 ──
            // ═══════════════════════════════════════════
            auroraUniforms.uTime.value = time;
            auroraUniforms.uIntensity.value = THREE.MathUtils.lerp(0.3, 0.8, partProgress);

            // ═══════════════════════════════════════════
            // ── NEW: God Rays 애니메이션 ──
            // ═══════════════════════════════════════════
            for (const ray of godRays) {
                ray.mesh.material.uniforms.uTime.value = time;
                const targetAlpha = partProgress > 0.2 ? partProgress * 0.8 : 0;
                ray.mesh.material.uniforms.uAlpha.value = THREE.MathUtils.lerp(
                    ray.mesh.material.uniforms.uAlpha.value, targetAlpha, 0.03
                );
                ray.mesh.rotation.y = Math.sin(time * ray.speed + ray.phase) * 0.05;
            }

            // ═══════════════════════════════════════════
            // ── NEW: 번개 시스템 업데이트 ──
            // ═══════════════════════════════════════════
            lightningTimer += 0.016;
            if (isParting && partProgress > 0.3 && lightningTimer > nextLightningTime) {
                lightningTimer = 0;
                nextLightningTime = 1.5 + Math.random() * 3.5;
                // 번개 생성
                const bolt = createLightningBolt();
                lightningBolts.push(bolt);
                // 번개 플래시
                lightningFlashLight.position.copy(bolt.pos);
                lightningFlashLight.intensity = 15 + Math.random() * 10;
                // 스크린 플래시
                screenFlashEl.classList.add('flash');
                setTimeout(() => screenFlashEl.classList.remove('flash'), 80);
                setTimeout(() => {
                    screenFlashEl.classList.add('flash');
                    setTimeout(() => screenFlashEl.classList.remove('flash'), 40);
                }, 150);
                // 카메라 흔들림
                shakeIntensity = 2.5 + Math.random() * 1.5;
                // 동적 블룸 강화
                bloomPass.strength = 3.5;
            }

            // 번개 볼트 업데이트
            for (let bi = lightningBolts.length - 1; bi >= 0; bi--) {
                const b = lightningBolts[bi];
                b.life -= b.decay;
                b.flickerPhase += 0.5;
                const flicker = b.life > 0.3 ? (0.5 + Math.sin(b.flickerPhase * 15) * 0.5) : 1.0;
                b.group.traverse(child => {
                    if (child.isMesh) {
                        child.material.opacity = Math.max(0, b.life * flicker);
                    }
                });
                if (b.life <= 0) {
                    scene.remove(b.group);
                    b.group.traverse(child => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            child.material.dispose();
                        }
                    });
                    lightningBolts.splice(bi, 1);
                }
            }

            // 번개 조명 감쇠
            lightningFlashLight.intensity *= 0.88;

            // 카메라 흔들림 감쇠
            shakeIntensity *= 0.92;
            cameraShake.set(
                (Math.random() - 0.5) * shakeIntensity,
                (Math.random() - 0.5) * shakeIntensity * 0.7,
                (Math.random() - 0.5) * shakeIntensity * 0.3
            );

            // 동적 블룸 (번개 후 원래대로)
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength,
                isParting ? 2.8 : 2.2, 0.05);

            partProgress = THREE.MathUtils.lerp(partProgress, isParting ? 1.0 : 0.0, 0.02);
            waterUniforms.partProgress.value = partProgress;

            currentPathWidth = THREE.MathUtils.lerp(currentPathWidth, targetPathWidth, 0.05);
            waterUniforms.pathWidth.value = currentPathWidth;

            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(targetPlane, targetPos);

            if (targetPos) {
                // 지팡이가 커서 역할 — 빠르게 따라감
                const staffLerp = 0.18;
                const staffTargetZ = THREE.MathUtils.lerp(targetPos.z, targetPos.z - 180, partProgress);
                const staffTargetY = THREE.MathUtils.lerp(targetPos.y, -5, partProgress);
                staffGroup.position.x = THREE.MathUtils.lerp(staffGroup.position.x, targetPos.x, staffLerp);
                staffGroup.position.y = THREE.MathUtils.lerp(staffGroup.position.y, Math.max(staffTargetY, 15), staffLerp);
                staffGroup.position.z = THREE.MathUtils.lerp(staffGroup.position.z, staffTargetZ, staffLerp);
            }
            // 자연스러운 기울기 (마우스 방향으로 살짝 기울어짐)
            staffGroup.rotation.z = -mouse.x * 0.22;
            staffGroup.rotation.x = mouse.y * 0.12;

            // 지팡이 빛 강화 — 더 극적으로
            staffLight.intensity = 8 + (currentPathWidth * 0.35) + Math.sin(time * 3.0) * 3.0 * partProgress;
            staffLight.color.lerpColors(
                new THREE.Color(0xffaa44),
                new THREE.Color(0xffddaa),
                partProgress
            );

            // staffPos를 셰이더에 전달
            waterUniforms.staffPos.value.copy(staffGroup.position);

            // 물벽 내부 조명 (갈라질 때 활성화) — 강화됨
            const wallLightBase = partProgress * 6.0;
            const lightningBoost = lightningFlashLight.intensity * 0.3;
            wallLightL.intensity = wallLightBase + lightningBoost;
            wallLightR.intensity = wallLightBase + lightningBoost;
            wallLightL.color.setHSL(0.6, 0.5, 0.5 + lightningBoost * 0.02);
            wallLightR.color.setHSL(0.6, 0.5, 0.5 + lightningBoost * 0.02);
            wallLightL.position.set(-currentPathWidth * 0.5, 50 + partProgress * 40, staffGroup.position.z - 60);
            wallLightR.position.set(currentPathWidth * 0.5, 50 + partProgress * 40, staffGroup.position.z - 60);

            // ── 카메라 제어 ──
            // 평소: EXODUS 타이틀이 보이는 정면 시점
            // 갈라질 때: 수면 바로 위 극적인 저각 — 물벽이 좌우로 솟구치는 것을 정면에서
            const baseY    = isMobile ? 85 : 55;
            const baseZ    = isMobile ? 280 : 220;
            const partY    = (isMobile ? 30 : 18) + (currentPathWidth - 60) * 0.05;
            const partZ    = (isMobile ? 320 : 280) + (currentPathWidth - 60) * 1.5;

            const camY = THREE.MathUtils.lerp(baseY, partY, partProgress);
            const camZ = THREE.MathUtils.lerp(baseZ, partZ, partProgress);
            const camX = mouse.x * THREE.MathUtils.lerp(isMobile ? 15 : 30, 15, partProgress);

            targetCameraPos.set(camX, camY, camZ);
            camera.position.lerp(targetCameraPos, 0.05);
            // ── NEW: 카메라 흔들림 적용 ──
            camera.position.add(cameraShake);

            // lookAt: 평소엔 EXODUS 중앙, 갈라질 땐 수면 정면 응시
            const lookX = THREE.MathUtils.lerp(mouse.x * (isMobile ? 10 : 20), mouse.x * 15, partProgress);
            const lookY = THREE.MathUtils.lerp(isMobile ? 120 : 80,  8 + partProgress * 30, partProgress);
            const lookZ = THREE.MathUtils.lerp(-300, -120, partProgress);
            camera.lookAt(lookX, lookY, lookZ);

            // 물보라 + 미스트 + 캐스케이드
            if (isParting && partProgress > 0.3) {
                const positions = particles.geometry.attributes.position.array;
                const sizes = particles.geometry.attributes.size.array;

                // 한 프레임에 여러 파티클 스폰 — 강화됨
                const spawnCount = Math.min(isMobile ? 5 : 14, particleCount - pIndex);
                for (let s = 0; s < spawnCount; s++) {
                    const type = Math.random();
                    const side = (Math.random() > 0.5 ? 1 : -1);

                    if (type < 0.4) {
                        // 물보라 (벽 가장자리에서 튀어오름) — 강화됨
                        positions[pIndex * 3] = side * (currentPathWidth + Math.random() * 20);
                        positions[pIndex * 3 + 1] = 20 + Math.random() * 120;
                        positions[pIndex * 3 + 2] = (Math.random() - 0.5) * 500 - 50;
                        particleVels[pIndex].set(
                            side * (Math.random() * 4.0 + 1.5),
                            Math.random() * 4.5 + 2.5,
                            (Math.random() - 0.5) * 4.0
                        );
                        sizes[pIndex] = 2.0 + Math.random() * 4.0;
                        particleTypes[pIndex] = 0;
                    } else if (type < 0.7) {
                        // 미스트 (벽 근처에 떠다님, 느리게)
                        positions[pIndex * 3] = side * (currentPathWidth + Math.random() * 40);
                        positions[pIndex * 3 + 1] = 5 + Math.random() * 30;
                        positions[pIndex * 3 + 2] = (Math.random() - 0.5) * 400 - 50;
                        particleVels[pIndex].set(
                            (Math.random() - 0.5) * 0.5,
                            Math.random() * 0.3 + 0.1,
                            (Math.random() - 0.5) * 0.5
                        );
                        sizes[pIndex] = 5.0 + Math.random() * 5.0;
                        particleTypes[pIndex] = 1;
                    } else {
                        // 캐스케이드 (벽 타고 흘러내림)
                        positions[pIndex * 3] = side * (currentPathWidth + Math.random() * 10);
                        positions[pIndex * 3 + 1] = 60 + Math.random() * 100;
                        positions[pIndex * 3 + 2] = (Math.random() - 0.5) * 300 - 50;
                        particleVels[pIndex].set(
                            side * Math.random() * 0.3,
                            -Math.random() * 1.5 - 0.5,
                            (Math.random() - 0.5) * 0.5
                        );
                        sizes[pIndex] = 1.5 + Math.random() * 2.0;
                        particleTypes[pIndex] = 2;
                    }
                    pIndex = (pIndex + 1) % particleCount;
                }
                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.size.needsUpdate = true;
            }

            const pPositions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                if (pPositions[i * 3 + 1] > -500) {
                    pPositions[i * 3] += particleVels[i].x;
                    pPositions[i * 3 + 1] += particleVels[i].y;
                    pPositions[i * 3 + 2] += particleVels[i].z;

                    if (particleTypes[i] === 0) {
                        // 스프레이: 중력 + 감속
                        particleVels[i].y -= 0.06;
                        particleVels[i].x *= 0.995;
                    } else if (particleTypes[i] === 1) {
                        // 미스트: 느린 부유, 약한 바람
                        particleVels[i].x += (Math.random() - 0.5) * 0.02;
                        particleVels[i].y *= 0.998;
                    } else {
                        // 캐스케이드: 벽면 타고 가속 낙하
                        particleVels[i].y -= 0.03;
                    }

                    if (pPositions[i * 3 + 1] < -20) pPositions[i * 3 + 1] = -1000;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // renderer.render(scene, camera); 대신 composer 사용 (발광 효과)
            composer.render();
        }

        animate();
    </script>
</body>
