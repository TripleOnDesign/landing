<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripleOnDesign</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        .work-modal-trigger {
            cursor: pointer;
        }
        body.hero-locked {
            overflow: hidden;
        }

        /* Mobile 2-row sidebar layout */
        @media (max-width: 768px) {
            #sidebar {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 0 10px;
            }

            .sidebar-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .sidebar-row-top {
                gap: 12px;
            }

            .sidebar-row-top .sidebar-section {
                margin: 0;
                padding: 0;
            }

            .sidebar-row-top .sidebar-colors label,
            .sidebar-row-top .sidebar-morph label {
                display: none;
            }

            .sidebar-row-top #color-picker {
                display: flex;
                gap: 6px;
            }

            .sidebar-row-top .input-group {
                display: flex;
                gap: 4px;
                margin: 0;
            }

            .sidebar-row-top .input-group input {
                width: 90px;
                font-size: 12px;
                padding: 5px 8px;
            }

            .sidebar-row-top .input-group button {
                padding: 4px 6px;
            }

            .sidebar-row-bottom {
                justify-content: center;
            }

            .sidebar-row-bottom .sidebar-shapes {
                margin: 0;
                padding: 0;
            }

            .sidebar-row-bottom .shape-buttons {
                display: flex;
                gap: 6px;
            }

            .sidebar-row-bottom .shape-btn {
                font-size: 11px;
                padding: 5px 10px;
            }
        }
    </style>
</head>

<body class="hero-locked">
    <header>
        <a href="index.html" class="logo">
            <video autoplay muted loop playsinline>
                <source src="logo.mp4" type="video/mp4">
            </video>
        </a>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="works.html">Works</a></li>
                <li><a href="about.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="hero-content">
                <h1 id="hero-title">TRIPLE ON DESIGN</h1>
            </div>

            <div id="ui">
                <div id="info">CREATE BEYOND.</div>
            </div>

            <div id="sidebar">
                <!-- Row 1: Colors + Text Input -->
                <div class="sidebar-row sidebar-row-top">
                    <div class="sidebar-section sidebar-colors">
                        <label>Colors</label>
                        <div id="color-picker">
                            <div class="color-option" data-scheme="fire"
                                style="background: linear-gradient(to bottom right, #ff4500, #ffcc00)"></div>
                            <div class="color-option" data-scheme="neon"
                                style="background: linear-gradient(to bottom right, #ff00ff, #00ffff)"></div>
                            <div class="color-option" data-scheme="nature"
                                style="background: linear-gradient(to bottom right, #00ff00, #66ffcc)"></div>
                            <div class="color-option" data-scheme="rainbow"
                                style="background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)">
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-section sidebar-morph">
                        <label>Text</label>
                        <div class="input-group">
                            <input type="text" id="text-morph-input" placeholder="예)hello" maxlength="18">
                            <button id="text-morph-btn" aria-label="Morph to text">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="13 17 18 12 13 7"></polyline>
                                    <polyline points="6 17 11 12 6 7"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Shape Buttons -->
                <div class="sidebar-row sidebar-row-bottom">
                    <div class="sidebar-section sidebar-shapes">
                        <div class="shape-buttons">
                            <button class="shape-btn" data-shape="DNA">DNA</button>
                            <button class="shape-btn" data-shape="Galaxy">Galaxy</button>
                            <button class="shape-btn" data-shape="Virus">Virus</button>
                            <button class="shape-btn" data-shape="Smile">Smile</button>
                        </div>
                    </div>
                </div>
            </div>

            <a href="about.html" id="scroll-btn">
                <span class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </span>
                <span class="text">Show More</span>
            </a>


        </section>

    </main>

    <footer>
        <div class="footer-info">
            <p>&copy; 2026 Triple On Design. All rights reserved.</p>
        </div>
    </footer>

    <!-- Import Map for Three.js and Addons -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
          "animejs": "https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.es.js",
          "simplex-noise": "https://cdn.skypack.dev/simplex-noise@4.0.1"
        }
      }
    </script>



    <!-- Three.js Logic -->
    <script type="module" src="main.js?v=11"></script>

</body>

</html>
