<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOD 3D Interactive Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #aurora {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #fx {
            display: block;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #title-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
            z-index: 30;
        }

        #title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(1.6rem, 4.8vw, 5.6rem);
            color: #ffffff;
            letter-spacing: -0.05em;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.35),
                0 0 60px rgba(200, 220, 255, 0.15);
        }

        #title span {
            display: inline-block;
            opacity: 0;
            will-change: opacity, filter;
        }

        #subtitle {
            margin-top: 0.75em;
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: clamp(1rem, 2.6vw, 2.2rem);
            color: rgba(255, 255, 255, 0.82);
            letter-spacing: 0.01em;
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        #subtitle.active {
            opacity: 1;
            transform: translateY(0);
        }

        .model-slot {
            position: fixed;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: screen;
            visibility: hidden;
        }

        .model-slot.visible {
            visibility: visible;
            animation: fadeUp 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        @keyframes fadeUp {
            0% {
                filter: blur(8px) brightness(3);
            }
            100% {
                filter: none;
            }
        }

        .model-frame {
            border: none;
            overflow: hidden;
            display: block;
            pointer-events: auto;
            background: transparent;
        }

        .model-frame.size-world {
            width: clamp(480px, 68vmin, 880px);
            height: clamp(480px, 68vmin, 880px);
        }
        .model-frame.size-saturn {
            width: clamp(739px, 113vmin, 1375px);
            height: clamp(739px, 113vmin, 1375px);
        }
        .model-frame.size-md {
            width: clamp(480px, 72vmin, 912px);
            height: clamp(480px, 72vmin, 912px);
        }
        .model-frame.size-cell {
            width: clamp(306px, 46vmin, 582px);
            height: clamp(306px, 46vmin, 582px);
        }
        .model-frame.size-switch {
            width: clamp(380px, 52vmin, 640px);
            height: clamp(380px, 52vmin, 640px);
            transform: scale(0.9);
            transform-origin: center center;
        }
        .model-frame.size-pyramid {
            width: clamp(700px, 110vmin, 1400px);
            height: clamp(700px, 110vmin, 1400px);
        }

        @media (max-width: 768px) {
            .model-frame.size-world {
                width: clamp(180px, 52vmin, 340px);
                height: clamp(180px, 52vmin, 340px);
            }
            .model-frame.size-saturn {
                width: clamp(220px, 65vmin, 420px);
                height: clamp(220px, 65vmin, 420px);
            }
            .model-frame.size-md {
                width: clamp(180px, 52vmin, 340px);
                height: clamp(180px, 52vmin, 340px);
            }
            .model-frame.size-cell {
                width: clamp(150px, 40vmin, 260px);
                height: clamp(150px, 40vmin, 260px);
            }
            .model-frame.size-switch {
                width: clamp(160px, 44vmin, 300px);
                height: clamp(160px, 44vmin, 300px);
                transform: scale(0.9);
            }
            .model-frame.size-pyramid {
                width: clamp(200px, 60vmin, 380px);
                height: clamp(200px, 60vmin, 380px);
            }
        }
    </style>
</head>

<body>

    <canvas id="aurora"></canvas>
    <canvas id="fx"></canvas>

    <div class="model-slot" id="slot-0">
        <iframe class="model-frame size-md" id="frame-0" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>
    <div class="model-slot" id="slot-1">
        <iframe class="model-frame size-cell" id="frame-1" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>
    <div class="model-slot" id="slot-2">
        <iframe class="model-frame size-pyramid" id="frame-2" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>
    <div class="model-slot" id="slot-3">
        <iframe class="model-frame size-world" id="frame-3" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>
    <div class="model-slot" id="slot-4">
        <iframe class="model-frame size-switch" id="frame-4" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>
    <div class="model-slot" id="slot-5">
        <iframe class="model-frame size-saturn" id="frame-5" loading="eager" scrolling="no" allow="autoplay"></iframe>
    </div>

    <div id="title-wrap">
        <div id="title"></div>
        <div id="subtitle">As you think!&nbsp;&nbsp;As you say!</div>
    </div>

        var W, H;

        function resize() {
            W = auroraCanvas.width = document.getElementById("fx").width = window.innerWidth;
            H = auroraCanvas.height = document.getElementById("fx").height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        var t = 0;
        function drawAurora() {
            if (!img.complete || !img.naturalWidth) { requestAnimationFrame(drawAurora); return; }
            if (W < 1 || H < 1) { requestAnimationFrame(drawAurora); return; }
            var iW = img.naturalWidth, iH = img.naturalHeight;
            var sH = H / 3, isH = iH / 3;
            ac.drawImage(img, 0, 0, W, H);

            ac.save(); ac.beginPath(); ac.rect(0, 0, W, sH); ac.clip();
            for (var y = 0; y < sH; y += 3) {
                var ph = y * 0.055 + t * 0.5;
                var off = Math.sin(ph) * 2.5 + Math.sin(ph * 1.7 + 1.2) * 1.5;
                ac.drawImage(img, 0, (y / H) * iH, iW, (3 / H) * iH + 0.5, off, y, W, 4);
            }
            ac.restore();

            ac.save(); ac.beginPath(); ac.rect(0, sH * 2, W, sH); ac.clip();
            for (var x = 0; x < W; x += 3) {
                var ph2 = x * 0.045 + t * 0.35;
                var off2 = Math.sin(ph2) * 2 + Math.sin(ph2 * 1.9 + 0.8) * 1.5;
                ac.drawImage(img, (x / W) * iW, isH * 2, (3 / W) * iW + 0.5, isH, x, sH * 2 + off2, 4, sH);
            }
            ac.restore();

            var midPadT = 12, midPadB = 20;
            ac.save(); ac.beginPath(); ac.rect(0, sH - midPadT, W, sH + midPadT + midPadB); ac.clip();
            ac.drawImage(img, 0, isH - (midPadT / H) * iH, iW, isH + ((midPadT + midPadB) / H) * iH,
                0, sH - midPadT, W, sH + midPadT + midPadB);
            ac.restore();

            t += 0.016;
            requestAnimationFrame(drawAurora);
        }
        img.onload = drawAurora;

        var fx = document.getElementById("fx");
        var fc = fx.getContext("2d");

        var TEXT = "TOD 3D INTERACTIVE LAB";
        var titleEl = document.getElementById("title");
        var spans = TEXT.split("").map(function(ch) {
            var s = document.createElement("span");
            s.textContent = ch === " " ? "\u00A0" : ch;
            titleEl.appendChild(s);
            return s;
        });

        var SLOT_COUNT = 6;
        var ORBIT_SPEED = 0.08;
        var orbitAngle = 0;
        var orbiting = false;
        var orbitPhase = 0;

        function positionSlotsAtAngle(baseAngle) {
            var cx = W / 2;
            var cy = H / 2;
            var isMobile = W <= 768;
            var rx = W * (isMobile ? 0.28 : 0.40);
            var ry = H * (isMobile ? 0.20 : 0.28);
            var tiltX = Math.sin(orbitPhase * 0.14) * 0.30;
            var tiltZ = Math.cos(orbitPhase * 0.09) * 0.22;
            var cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
            var cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);

            for (var i = 0; i < SLOT_COUNT; i++) {
                var angle = baseAngle + (i / SLOT_COUNT) * Math.PI * 2;
                var el = document.getElementById("slot-" + i);
                if (el) {
                    var px = rx * Math.cos(angle);
                    var py = ry * Math.sin(angle);
                    var ry1 = py * cosTX;
                    var rz1 = py * sinTX;
                    var rx2 = px * cosTZ - ry1 * sinTZ;
                    var ry2 = px * sinTZ + ry1 * cosTZ;
                    var rz2 = rz1;
                    el.style.left = (cx + rx2) + "px";
                    el.style.top = (cy + ry2) + "px";
                    var depth = rz2 / (ry * 1.2);
                    var baseScale = isMobile ? 0.45 : 0.65;
                    var scaleRange = isMobile ? 0.25 : 0.35;
                    var scale = baseScale + scaleRange * (1 - depth) / 2;
                    var zi = Math.round(10 + (1 - depth) * 5);
                    el.style.zIndex = zi;
                    el.style.transform = "translate(-50%, -50%) scale(" + scale.toFixed(3) + ")";
                }
            }
        }

        var lastOrbitTime = 0;
        function orbitLoop(now) {
            if (!orbiting) return;
            if (!lastOrbitTime) lastOrbitTime = now;
            var dt = (now - lastOrbitTime) / 1000;
            lastOrbitTime = now;
            orbitAngle += ORBIT_SPEED * dt;
            orbitPhase += dt;
            positionSlotsAtAngle(orbitAngle);
            requestAnimationFrame(orbitLoop);
        }

        function startOrbit() {
            orbiting = true;
            lastOrbitTime = 0;
            orbitAngle = -Math.PI / 2;
            positionSlotsAtAngle(orbitAngle);
            requestAnimationFrame(orbitLoop);
        }

        positionSlotsAtAngle(-Math.PI / 2);

        function startIntro() {
            document.fonts.ready.then(function() {
                requestAnimationFrame(function() {
                    if (W < 1 || H < 1) { setTimeout(startIntro, 100); return; }
                    var cx = W / 2, cy = H / 2;
                    var charPositions = spans.map(function(s) {
                        var r = s.getBoundingClientRect();
                        return r.left + r.width / 2;
                    });
                    var minCP = Math.min.apply(null, charPositions);
                    var maxCP = Math.max.apply(null, charPositions);
                    var beamMaxR = Math.max(cx - minCP, maxCP - cx);
                    if (beamMaxR < 1) beamMaxR = cx;

                    var SPARKLE_DUR = 500;
                    var BEAM_DUR = 450;
                    var beamStartT = null;
                    var startTime = performance.now();

                    function fxLoop(now) {
                        fc.clearRect(0, 0, W, H);
                        var elapsed = now - startTime;
                        if (elapsed < SPARKLE_DUR) {
                            var prog = elapsed / SPARKLE_DUR;
                            var ease = 1 - Math.pow(1 - prog, 3.5);
                            var glowR = Math.max(1, 2 + ease * 88);
                            var blurV = 22 - ease * 14;
                            var alpha = prog < 0.75 ? 1 : 1 - ((prog - 0.75) / 0.25);
                            fc.save();
                            fc.globalAlpha = alpha;
                            fc.filter = "blur(" + blurV.toFixed(1) + "px)";
                            var grad = fc.createRadialGradient(cx, cy, 0, cx, cy, glowR);
                            grad.addColorStop(0, "rgba(255,255,255,1)");
                            grad.addColorStop(0.2, "rgba(230,245,255,0.95)");
                            grad.addColorStop(0.5, "rgba(200,225,255,0.6)");
                            grad.addColorStop(1, "rgba(170,205,255,0)");
                            fc.fillStyle = grad;
                            fc.beginPath(); fc.arc(cx, cy, glowR, 0, Math.PI * 2); fc.fill();
                            fc.filter = "none";
                            if (prog < 0.6) {
                                var coreR = Math.max(1, 4 - ease * 3);
                                fc.fillStyle = "#ffffff";
                                fc.beginPath(); fc.arc(cx, cy, coreR, 0, Math.PI * 2); fc.fill();
                            }
                            fc.restore();
                        } else {
                            if (!beamStartT) beamStartT = now;
                            var beamProg = Math.min((now - beamStartT) / BEAM_DUR, 1);
                            var ease2 = 1 - Math.pow(1 - beamProg, 3);
                            var beamR = ease2 * beamMaxR * 1.05;
                            var alpha2 = beamProg < 0.8 ? 1 : 1 - ((beamProg - 0.8) / 0.2);
                            var glowH = 28 + 12 * (1 - beamProg);
                            var vGrad = fc.createLinearGradient(cx, cy - glowH, cx, cy + glowH);
                            vGrad.addColorStop(0, "rgba(200,225,255,0)");
                            vGrad.addColorStop(0.5, "rgba(210,230,255,0.35)");
                            vGrad.addColorStop(1, "rgba(200,225,255,0)");
                            fc.save();
                            fc.globalAlpha = alpha2;
                            fc.filter = "blur(6px)";
                            fc.fillStyle = vGrad;
                            fc.fillRect(cx - beamR, cy - glowH, beamR * 2, glowH * 2);
                            fc.filter = "none";
                            fc.restore();

                            spans.forEach(function(s, i) {
                                var dist = Math.abs(charPositions[i] - cx);
                                var enter = dist - 5;
                                if (beamR >= enter) {
                                    var p = Math.min((beamR - enter) / 60, 1);
                                    s.style.opacity = p.toFixed(3);
                                    s.style.filter = "blur(" + ((1 - p) * 3).toFixed(1) + "px)";
                                }
                            });

                            if (beamProg >= 1) {
                                spans.forEach(function(s) { s.style.opacity = "1"; s.style.filter = "none"; });
                                setTimeout(function() { document.getElementById("subtitle").classList.add("active"); }, 80);
                                revealSlots();
                                return;
                            }
                        }
                        requestAnimationFrame(fxLoop);
                    }
                    requestAnimationFrame(fxLoop);
                });
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startIntro);
        } else {
            startIntro();
        }

        function revealSlots() {
            for (var i = 0; i < SLOT_COUNT; i++) {
                (function(idx) {
                    setTimeout(function() {
                        var el = document.getElementById("slot-" + idx);
                        if (el) el.classList.add("visible");
                    }, 200 + idx * 200);
                })(i);
            }
            setTimeout(startOrbit, 200 + SLOT_COUNT * 200 + 400);
        }
    </script>
</body>

</html>
