<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOD 3D Interactive Lab — Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" as="script" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #content-area {
            width: 100%; height: 100%;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #aurora-bg {
            position: absolute; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(255, 200, 60, 0.35) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 10%, rgba(255, 120, 160, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 25%, rgba(160, 220, 100, 0.28) 0%, transparent 40%),
                radial-gradient(ellipse at 25% 60%, rgba(80, 140, 255, 0.35) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 70%, rgba(160, 80, 220, 0.32) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 90%, rgba(255, 160, 200, 0.2) 0%, transparent 40%),
                linear-gradient(180deg, #0c0c20 0%, #10102a 30%, #141430 60%, #0e0e22 100%);
            animation: auroraDrift 14s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift {
            0%   { filter: brightness(1) saturate(1.1) hue-rotate(0deg); }
            33%  { filter: brightness(1.1) saturate(1.25) hue-rotate(12deg); }
            66%  { filter: brightness(1.05) saturate(1.15) hue-rotate(-8deg); }
            100% { filter: brightness(1.1) saturate(1.2) hue-rotate(5deg); }
        }
        
        #aurora-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.35) 100%);
        }
        #particle-canvas {
            position: absolute; inset: 0; z-index: 2;
            pointer-events: none;
        }

        #title-wrap {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 100;
            text-align: center;
            padding: max(env(safe-area-inset-top, 12px), 12px) 16px 0;
            pointer-events: none;
            opacity: 0;
            animation: titleIn 0.8s ease 0.1s forwards;
        }
        @keyframes titleIn {
            0% { opacity: 0; transform: translateY(-12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.35em;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
        }
        #subtitle {
            margin-top: 2px;
            font-size: 9px;
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.4);
        }

        #active-frame {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: none; z-index: 10;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #active-frame.loaded { opacity: 1; }
        #active-frame.fading { opacity: 0; }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        #loader.active { opacity: 1; }
        .ring {
            width: 36px; height: 36px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Nav buttons */
        #nav {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            z-index: 200;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 16px max(env(safe-area-inset-bottom, 14px), 14px);
            opacity: 0;
            animation: navIn 0.6s ease 0.3s forwards;
        }
        @keyframes navIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .nav-btn {
            position: relative;
            min-width: 64px;
            height: 34px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22,0.61,0.36,1);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .nav-btn:active {
            transform: scale(0.93);
        }
        .nav-btn.active {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 16px rgba(180,210,255,0.15), inset 0 0 10px rgba(255,255,255,0.04);
        }
        .nav-btn .label {
            font-size: 10px;
            font-weight: 300;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .nav-btn.active .label {
            color: rgba(255,255,255,0.92);
            font-weight: 400;
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
    </style>
</head>

        ];

        function decodeScene(idx) {
            if (decodedCache[idx] !== null) return decodedCache[idx];
            try {
                decodedCache[idx] = atob(htmlBase64[idx]);
            } catch(e) {
                console.error("Decode error for scene", idx, e);
                decodedCache[idx] = "";
            }
            return decodedCache[idx];
        }

        function switchGraphic(idx) {
            if (idx === currentIdx) return;
            currentIdx = idx;

            btns.forEach(function(b, i) {
                b.classList.toggle("active", i === idx);
            });

            frame.classList.remove("loaded");
            frame.classList.add("fading");
            loader.classList.add("active");

            setTimeout(function() {
                frame.srcdoc = decodeScene(idx);
            }, 80);

            frame.onload = function() {
                frame.classList.remove("fading");
                void frame.offsetWidth;
                frame.classList.add("loaded");
                loader.classList.remove("active");
                frame.onload = null;

                // Pre-decode next scene in background
                var nextIdx = (idx + 1) % 5;
                setTimeout(function() { decodeScene(nextIdx); }, 500);
            };
        }

        function startCycle() {
            if (cycleTimer) clearInterval(cycleTimer);
            cycleTimer = setInterval(function() {
                var nextIdx = (currentIdx + 1) % 5;
                switchGraphic(nextIdx);
            }, CYCLE_INTERVAL);
        }

        // Initial load: decode first scene, start
        setTimeout(function() {
            switchGraphic(0);
            startCycle();
        }, 100);

        // Nav button click handlers — manual mode stops auto-cycle
        btns.forEach(function(btn) {
            btn.addEventListener("click", function(e) {
                e.stopPropagation();
                var idx = parseInt(btn.getAttribute("data-idx"));
                switchGraphic(idx);
                if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; }
            });
        });

        // Subtle floating particles
        (function() {
            var c = document.getElementById("particle-canvas");
            var ctx = c.getContext("2d");
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var W, H, particles = [];
            var COUNT = 25;

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                c.width = W * dpr;
                c.height = H * dpr;
                c.style.width = W + "px";
                c.style.height = H + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            var COLORS = [
                [255, 210, 80],
                [255, 140, 180],
                [160, 225, 120],
                [120, 170, 255],
                [180, 120, 230]
            ];

            function create() {
                particles = [];
                for (var i = 0; i < COUNT; i++) {
                    var col = COLORS[Math.floor(Math.random() * COLORS.length)];
                    particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.2 + 0.4,
                        dx: (Math.random() - 0.5) * 0.15,
                        dy: (Math.random() - 0.5) * 0.12,
                        alpha: Math.random() * 0.5 + 0.15,
                        phase: Math.random() * Math.PI * 2,
                        color: col
                    });
                }
            }

            function draw(t) {
                ctx.clearRect(0, 0, W, H);
                for (var i = 0; i < COUNT; i++) {
                    var p = particles[i];
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < -10) p.x = W + 10;
                    if (p.x > W + 10) p.x = -10;
                    if (p.y < -10) p.y = H + 10;
                    if (p.y > H + 10) p.y = -10;
                    var flicker = 0.5 + 0.5 * Math.sin(t * 0.0018 + p.phase);
                    var a = p.alpha * (0.3 + 0.7 * flicker);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(" + p.color[0] + "," + p.color[1] + "," + p.color[2] + "," + a + ")";
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            resize();
            create();
            requestAnimationFrame(draw);
            window.addEventListener("resize", function() { resize(); create(); });
        })();
    </script>
