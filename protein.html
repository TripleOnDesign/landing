<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Protein Viewer</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --accent-gray: rgba(255, 255, 255, 0.3);
      --active-gray: rgba(100, 100, 100, 0.6);
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
      -webkit-tap-highlight-color: transparent;
    }

    .main-container {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    #viewer-container {
      width: 100%;
      height: 100%;
    }

    .control-panel {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px;
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .menu-btn, #reset-btn {
      width: 110px;
      padding: 8px 0;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.75);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      text-align: center;
    }

    .menu-btn:hover, #reset-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .menu-btn.active, .menu-btn:active {
      background: rgba(255, 255, 255, 0.15) !important;
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      box-shadow: none;
    }

    #reset-btn {
      margin-top: 2px;
      color: rgba(255, 130, 130, 0.8);
      border-color: rgba(255, 100, 100, 0.15);
      font-size: 10px;
    }

    #reset-btn:hover {
      background: rgba(255, 100, 100, 0.15);
      border-color: rgba(255, 100, 100, 0.35);
      color: #ff9090;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 3px 0;
    }

    @media (max-width: 768px) {
      .control-panel {
        top: auto;
        bottom: 10px;
        right: 50%;
        transform: translateX(50%);
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        width: auto;
        padding: 6px;
        gap: 4px;
        border-radius: 10px;
      }

      .menu-btn {
        width: auto;
        padding: 6px 10px;
        font-size: 9px;
        white-space: nowrap;
      }

      .divider {
        width: 1px;
        height: 20px;
        margin: 0 2px;
      }

      #reset-btn {
        width: auto;
        margin-top: 0;
        padding: 6px 10px;
        font-size: 9px;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div id="viewer-container"></div>

    <div class="control-panel">
      <button class="menu-btn active" data-style="cartoon">CARTOON</button>
      <button class="menu-btn" data-style="stick">STICK</button>
      <button class="menu-btn" data-style="surface">SURFACE</button>
      <button class="menu-btn" data-style="combined">COMBINED</button>

      <div class="divider"></div>

      <button id="reset-btn">RESET VIEW</button>
    </div>
  </div>

  <script>
    $(document).ready(function() {
      const element = $('#viewer-container');
      const config = { backgroundColor: '#000000', alpha: false };
      const viewer = $3Dmol.createViewer(element, config);

      $3Dmol.download("pdb:6M3T", viewer, {}, function() {

        function renderStyle(styleType) {
          viewer.removeAllSurfaces();

          switch (styleType) {
            case 'cartoon':
              viewer.setStyle({}, { cartoon: { color: 'spectrum' } });
              break;

            case 'stick':
              viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'amino' } });
              break;

            case 'surface':
              viewer.setStyle({}, {});
              viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 1, colorscheme: 'spectrum' }, {});
              break;

            case 'combined':
              viewer.setStyle({}, { cartoon: { color: 'spectrum' } });
              viewer.addStyle({}, { stick: { radius: 0.1, opacity: 0.5, colorscheme: 'greenCarbon' } });
              viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.4, color: 'white' }, {});
              break;
          }

          viewer.render();
        }

        renderStyle('cartoon');
        viewer.zoomTo();
        var zoomLevel = window.innerWidth <= 768 ? 0.6 : 1.2;
        viewer.zoom(zoomLevel, 1000);

        var initialView = null;
        setTimeout(function() {
          initialView = viewer.getView();
        }, 1200);

        $('.menu-btn').click(function() {
          $('.menu-btn').removeClass('active');
          $(this).addClass('active');
          renderStyle($(this).data('style'));
        });

        $('#reset-btn').click(function() {
          $('.menu-btn').removeClass('active');
          $('.menu-btn[data-style="cartoon"]').addClass('active');
          renderStyle('cartoon');
          if (initialView) {
            viewer.setView(initialView);
          } else {
            viewer.zoomTo();
            viewer.zoom(1.2, 1000);
          }
          viewer.render();
        });

      });
    });
  </script>
</body>
</html>
